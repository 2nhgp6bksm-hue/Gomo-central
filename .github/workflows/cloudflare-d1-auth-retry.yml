name: One-shot D1 auth retry
# Reprise distante unique autorisee le 3 septembre 2026. Ne pas relancer.

on:
  push:
    branches:
      - test/core-d1-read-optimization
    paths:
      - .github/workflows/cloudflare-d1-auth-retry.yml
      - validation/retry-cloudflare-entry.js
      - validation/retry-validate.mjs

permissions:
  contents: read

concurrency:
  group: gomo-core-d1-auth-retry-28d4ef7
  cancel-in-progress: false

env:
  TESTED_COMMIT: 28d4ef7ee214ffd806d723b5f5369d9147168b48
  VALIDATION_WORKER_NAME: gomo-core-d1-read-validation-28d4ef7
  VALIDATION_DATABASE_NAME: gomo-core-d1-write-validation-105d61d-a3-db
  VALIDATION_DATABASE_ID: bfb37928-febc-4ae6-8075-da89cc40d4d5
  PRODUCTION_DATABASE_ID: ac1b5094-c1f9-4706-b29b-8507e6f85a92
  WRANGLER_CONFIG: validation/retry-wrangler.generated.json
  RESULTS: validation-results-retry

jobs:
  retry-once:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CFPREVIEW }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PREVIEW || secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Lock application and safety boundaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$TESTED_COMMIT")" = "$TESTED_COMMIT"
          unexpected="$(git diff --name-only "$TESTED_COMMIT"..HEAD | grep -Ev '^(validation/(read-|retry-)|\.github/workflows/cloudflare-d1-(read-validation|auth-retry)\.yml$)' || true)"
          test -z "$unexpected"
          test "$VALIDATION_WORKER_NAME" != "gomo-core-test"
          test "$VALIDATION_WORKER_NAME" != "gomo-central"
          test "$VALIDATION_DATABASE_NAME" != "gomo-core-db"
          test "$VALIDATION_DATABASE_ID" != "$PRODUCTION_DATABASE_ID"

      - name: Local checks only
        run: |
          npm test
          node --test validation/read-meter.test.mjs
          node --check validation/retry-cloudflare-entry.js
          node --check validation/retry-validate.mjs

      - name: Prepare masked authentication and verify isolated D1 binding
        id: setup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RESULTS"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            accounts="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts?per_page=50")"
            account_id="$(printf '%s' "$accounts" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.success||j.result?.length!==1)process.exit(1);process.stdout.write(j.result[0].id)})')"
            echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"
          fi
          npx --yes wrangler@4.125.0 d1 list --json > "$RESULTS/d1-list.json"
          node -e 'const f=require("fs");const a=JSON.parse(f.readFileSync(process.argv[1]));const d=a.filter(x=>x.name===process.env.VALIDATION_DATABASE_NAME);if(d.length!==1)throw Error(`Expected one isolated D1, got ${d.length}`);const id=d[0].uuid||d[0].id;if(id!==process.env.VALIDATION_DATABASE_ID||id===process.env.PRODUCTION_DATABASE_ID)throw Error(`Unsafe D1 ${id}`)' "$RESULTS/d1-list.json"
          admin_key="$(openssl rand -hex 32)"
          echo "::add-mask::$admin_key"
          VALIDATION_WORKER_NAME="$VALIDATION_WORKER_NAME" VALIDATION_DATABASE_NAME="$VALIDATION_DATABASE_NAME" node validation/read-write-config.mjs "$VALIDATION_DATABASE_ID" "$admin_key" "$WRANGLER_CONFIG"
          node -e 'const f=require("fs");const p=process.argv[1];const c=JSON.parse(f.readFileSync(p));c.main="retry-cloudflare-entry.js";if(c.triggers)throw Error("Cron forbidden");if(c.d1_databases[0].database_id===process.env.PRODUCTION_DATABASE_ID)throw Error("Production D1 forbidden");f.writeFileSync(p,JSON.stringify(c,null,2)+"\n")' "$WRANGLER_CONFIG"
          echo "admin_key=$admin_key" >> "$GITHUB_OUTPUT"

      - name: Deploy authentication-only test harness
        run: npx --yes wrangler@4.125.0 deploy --config "$WRANGLER_CONFIG"

      - name: Wait for Worker version propagation
        run: sleep 30

      - name: Resolve isolated Worker URL
        id: origin
        shell: bash
        run: |
          set -euo pipefail
          subdomain="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.success||!j.result?.subdomain)process.exit(1);process.stdout.write(j.result.subdomain)})')"
          origin="https://${VALIDATION_WORKER_NAME}.${subdomain}.workers.dev"
          echo "origin=$origin" >> "$GITHUB_OUTPUT"
          echo "$origin" > "$RESULTS/worker-origin.txt"

      - name: Clear only the test endpoint cache without D1
        env:
          ORIGIN: ${{ steps.origin.outputs.origin }}
          ADMIN_KEY: ${{ steps.setup.outputs.admin_key }}
        run: |
          curl --retry 0 -fsS -X POST -H "Authorization: Bearer $ADMIN_KEY" "$ORIGIN/__validation/reset-current-cache" -o "$RESULTS/cache-reset.json"

      - name: Run refresh exactly once
        env:
          ORIGIN: ${{ steps.origin.outputs.origin }}
          ADMIN_KEY: ${{ steps.setup.outputs.admin_key }}
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 0 -fsS -D "$RESULTS/sync.headers" -o "$RESULTS/sync.json" -X POST -H "Authorization: Bearer $ADMIN_KEY" "$ORIGIN/api/core/refresh"
          node -e 'const j=require("./validation-results-retry/sync.json");if(!j.ok)throw Error(JSON.stringify(j))'

      - name: Call Members exactly once
        env:
          ORIGIN: ${{ steps.origin.outputs.origin }}
        run: curl --retry 0 -fsS -D "$RESULTS/members.headers" -o "$RESULTS/members.json" "$ORIGIN/api/core/members"

      - name: Call Power exactly once
        env:
          ORIGIN: ${{ steps.origin.outputs.origin }}
        run: curl --retry 0 -fsS -D "$RESULTS/power.headers" -o "$RESULTS/power.json" "$ORIGIN/api/core/power"

      - name: Build report without any additional D1 query
        run: node validation/retry-validate.mjs "$RESULTS"

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          echo "## One-shot D1 authentication retry" >> "$GITHUB_STEP_SUMMARY"
          echo "- Migration replayed: \`false\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Backfill replayed: \`false\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Historical recount: \`false\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cron configured: \`false\`" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RESULTS/validation-report.json" ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$RESULTS/validation-report.json" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gomo-core-d1-auth-retry-evidence
          path: validation-results-retry/
          if-no-files-found: warn
          retention-days: 30
