name: One-shot Core v0.8 refresh on gomo-core-test

on:
  push:
    branches:
      - deploy/core-v08-final-test-2026-09-20
    paths:
      - .github/workflows/core-v08-refresh-once.yml

permissions:
  contents: read

concurrency:
  group: core-v08-refresh-one-shot-2026-09-20
  cancel-in-progress: false

env:
  CANDIDATE_SHA: b02c909a851e7f35deedd13d7980d34d598a6223
  WORKER_NAME: gomo-core-test
  WORKER_URL: https://gomo-core-test.gjp86wh7p2.workers.dev
  EXPECTED_VERSION: 1072896a-eb51-4763-8ac3-b75c3994907c
  EXPECTED_DEPLOYMENT: ceb4ae6d-8120-4dcf-a858-7dff244d84d3
  DATABASE_NAME: gomo-core-v08-read-test-db
  DATABASE_ID: 45ca2537-70d2-409c-9db1-2fa1772c0a2d
  LAST_SYNC_BEFORE: 2026-09-19T19:15:39.551Z
  MEMBERS_BEFORE: "93"

jobs:
  refresh-exactly-once:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CFPREVIEW }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PREVIEW || secrets.CLOUDFLARE_ACCOUNT_ID }}
      CORE_ADMIN_KEY: ${{ secrets.GOMO_CORE_ADMIN_KEY }}

    steps:
      - name: Checkout immutable candidate for configuration checks only
        uses: actions/checkout@v4
        with:
          ref: b02c909a851e7f35deedd13d7980d34d598a6223
          fetch-depth: 0
          persist-credentials: false

      - name: Local immutable configuration gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          node validation/core-v08-preparation-guard.mjs
          node - <<'NODE'
          const fs = require('fs');
          const c = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          const d1 = c.d1_databases || [];
          if (c.name !== process.env.WORKER_NAME) throw new Error(`Worker interdit: ${c.name}`);
          if (c.vars?.GOMO_CORE_MODE !== 'test') throw new Error(`Mode interdit: ${c.vars?.GOMO_CORE_MODE}`);
          if (String(c.vars?.CORE_CURRENT_READS) !== '1') throw new Error(`CORE_CURRENT_READS interdit: ${c.vars?.CORE_CURRENT_READS}`);
          if ((c.triggers?.crons || []).length !== 0) throw new Error('Cron declare dans la configuration');
          if (d1.length !== 1 || d1[0].binding !== 'CORE_DB' || d1[0].database_name !== process.env.DATABASE_NAME || d1[0].database_id !== process.env.DATABASE_ID) {
            throw new Error(`D1 interdite: ${JSON.stringify(d1)}`);
          }
          const serialized = JSON.stringify(c);
          if (serialized.includes('gomo-central') || serialized.includes('gomo-core-db')) throw new Error('Cible de production interdite');
          NODE

      - name: Cloudflare read-only precheck and authentication gate
        id: precheck
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CORE_ADMIN_KEY:-}"
          node - <<'NODE'
          const fs = require('fs');
          const token = process.env.CLOUDFLARE_API_TOKEN;
          let account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const headers = {Authorization: `Bearer ${token}`};
          async function api(path) {
            const r = await fetch(`https://api.cloudflare.com/client/v4${path}`, {headers});
            const j = await r.json();
            if (!r.ok || !j.success) throw new Error(`GET ${path} a echoue: HTTP ${r.status}`);
            return j.result;
          }
          function deployments(x) { return Array.isArray(x) ? x : (x?.deployments || x?.items || []); }
          function bindings(doc) {
            const out = [], seen = new Set();
            function walk(x) {
              if (!x || typeof x !== 'object' || seen.has(x)) return;
              seen.add(x);
              if (typeof x.type === 'string' && typeof x.name === 'string') out.push(x);
              for (const value of Object.values(x)) walk(value);
            }
            walk(doc); return out;
          }
          (async () => {
            if (!account) {
              const accounts = await api('/accounts?per_page=50');
              if (!Array.isArray(accounts) || accounts.length !== 1) throw new Error('Compte Cloudflare non resolu sans ambiguite');
              account = accounts[0].id;
            }
            const base = `/accounts/${account}/workers/scripts/${process.env.WORKER_NAME}`;
            const [schedules, depResult, version, d1Result] = await Promise.all([
              api(`${base}/schedules`),
              api(`${base}/deployments`),
              api(`${base}/versions/${process.env.EXPECTED_VERSION}`),
              api(`/accounts/${account}/d1/database?per_page=100`),
            ]);
            if (!schedules || !Array.isArray(schedules.schedules) || schedules.schedules.length !== 0) throw new Error(`Cron actif ou reponse invalide: ${JSON.stringify(schedules)}`);
            const orderedDeployments = deployments(depResult).sort((a, b) => Date.parse(b.created_on || b.created_at || 0) - Date.parse(a.created_on || a.created_at || 0));
            const deployment = orderedDeployments[0];
            if (!deployment || deployment.id !== process.env.EXPECTED_DEPLOYMENT) throw new Error(`Deployment actif inattendu: ${deployment?.id || 'absent'}`);
            const active = (deployment.versions || []).find(x => (x.version_id || x.id) === process.env.EXPECTED_VERSION && Number(x.percentage) === 100);
            if (!active) throw new Error(`Version active/traffic inattendus: ${JSON.stringify(deployment.versions || [])}`);
            const list = bindings(version);
            const db = list.find(x => x.type === 'd1' && x.name === 'CORE_DB');
            const mode = list.find(x => x.type === 'plain_text' && x.name === 'GOMO_CORE_MODE');
            const reads = list.find(x => x.type === 'plain_text' && x.name === 'CORE_CURRENT_READS');
            const admin = list.find(x => x.name === 'GOMO_CORE_ADMIN_KEY');
            const dbId = db?.id || db?.database_id;
            if (dbId !== process.env.DATABASE_ID) throw new Error(`CORE_DB active interdite: ${dbId}`);
            if ((mode?.text ?? mode?.value) !== 'test') throw new Error('GOMO_CORE_MODE actif different de test');
            if (String(reads?.text ?? reads?.value) !== '1') throw new Error('CORE_CURRENT_READS actif different de 1');
            if (!admin) throw new Error('Binding GOMO_CORE_ADMIN_KEY absent du Worker actif');
            const databases = Array.isArray(d1Result) ? d1Result : (d1Result?.items || []);
            const named = databases.filter(x => x.name === process.env.DATABASE_NAME);
            if (named.length !== 1 || (named[0].uuid || named[0].id) !== process.env.DATABASE_ID) throw new Error('D1 test non identifiee exactement');
            if (databases.some(x => x.name === 'gomo-core-db' && (x.uuid || x.id) === dbId)) throw new Error('D1 production ciblee');
            fs.writeFileSync('/tmp/cloudflare-account-id', account);
            fs.writeFileSync('/tmp/precheck.json', JSON.stringify({ok:true, worker:process.env.WORKER_NAME, version:process.env.EXPECTED_VERSION, deployment:process.env.EXPECTED_DEPLOYMENT, traffic:'100%', d1:process.env.DATABASE_ID, mode:'test', currentReads:'1', cron:'AUCUN'}, null, 2));
          })().catch(e => { console.error(e.message); process.exit(1); });
          NODE
          echo "CLOUDFLARE_ACCOUNT_ID=$(cat /tmp/cloudflare-account-id)" >> "$GITHUB_ENV"

      - name: Send exactly one refresh POST and perform permitted GET checks
        id: refresh
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/core-v08-one-shot
          set +e
          http_code="$(curl --retry 0 --connect-timeout 20 --max-time 420 --silent --show-error \
            --dump-header /tmp/core-v08-one-shot/refresh.headers \
            --output /tmp/core-v08-one-shot/refresh.json \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $CORE_ADMIN_KEY" \
            "$WORKER_URL/api/core/refresh")"
          curl_exit=$?
          set -e
          printf '%s\n' "$http_code" > /tmp/core-v08-one-shot/refresh.http
          printf '%s\n' "$curl_exit" > /tmp/core-v08-one-shot/refresh.curl-exit

          status_http="$(curl --retry 0 --connect-timeout 20 --max-time 60 --silent --show-error \
            --output /tmp/core-v08-one-shot/status.json \
            --write-out '%{http_code}' \
            "$WORKER_URL/api/core/status?oneshot=$GITHUB_RUN_ID")"
          printf '%s\n' "$status_http" > /tmp/core-v08-one-shot/status.http

          node - <<'NODE'
          const fs = require('fs');
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const headers = {Authorization: `Bearer ${token}`};
          async function api(path) {
            const r = await fetch(`https://api.cloudflare.com/client/v4${path}`, {headers});
            const j = await r.json();
            if (!r.ok || !j.success) throw new Error(`GET ${path} a echoue: HTTP ${r.status}`);
            return j.result;
          }
          function readJson(path) { try { return JSON.parse(fs.readFileSync(path, 'utf8')); } catch { return null; } }
          (async () => {
            const response = readJson('/tmp/core-v08-one-shot/refresh.json');
            const status = readJson('/tmp/core-v08-one-shot/status.json');
            const http = Number(fs.readFileSync('/tmp/core-v08-one-shot/refresh.http', 'utf8').trim() || 0);
            const curlExit = Number(fs.readFileSync('/tmp/core-v08-one-shot/refresh.curl-exit', 'utf8').trim() || 0);
            const statusHttp = Number(fs.readFileSync('/tmp/core-v08-one-shot/status.http', 'utf8').trim() || 0);
            const schedules = await api(`/accounts/${account}/workers/scripts/${process.env.WORKER_NAME}/schedules`);
            const cronOk = schedules && Array.isArray(schedules.schedules) && schedules.schedules.length === 0;
            const last = status?.lastSuccessfulSync || {};
            const metadata = last.metadata || {};
            const storage = response?.storage || response || {};
            const source = name => last.sources?.[name]?.status ?? response?.sources?.[name]?.status ?? null;
            const report = {
              precheck: 'REUSSI', version: process.env.EXPECTED_VERSION,
              d1: `${process.env.DATABASE_NAME} (${process.env.DATABASE_ID})`, cronBefore: 'AUCUN',
              postsAuthorized: 1, postsSent: 1, curlExit, httpPost: http,
              result: curlExit === 0 && http === 200 && response?.ok === true ? 'REUSSI' : (curlExit !== 0 ? 'INCONNU' : 'ECHEC'),
              responseOk: response?.ok ?? null,
              syncId: response?.syncId ?? last.syncId ?? null,
              lastSyncBefore: process.env.LAST_SYNC_BEFORE,
              lastSyncAfter: last.completedAt ?? null,
              membersBefore: Number(process.env.MEMBERS_BEFORE),
              membersAfter: response?.members ?? last.members ?? null,
              lastIntel: source('lastIntel'), lastRank: source('lastRank'), lastWarRank: source('lastWarRank'),
              meaningfulRows: storage.meaningfulRows ?? metadata.meaningfulRows ?? null,
              rowsChanged: storage.rowsChanged ?? metadata.rowsChanged ?? null,
              statementsSkippedAsUnchanged: storage.statementsSkippedAsUnchanged ?? metadata.statementsSkippedAsUnchanged ?? null,
              derivedMetadataRowsSuppressed: storage.derivedMetadataRowsSuppressed ?? metadata.derivedMetadataRowsSuppressed ?? null,
              freshnessOnlyCanonicalRowsSuppressed: storage.freshnessOnlyCanonicalRowsSuppressed ?? metadata.freshnessOnlyCanonicalRowsSuppressed ?? null,
              statusHttp, cronAfter: cronOk ? 'AUCUN' : 'ECHEC', secondSync: false,
              deployment: false, productionModified: false,
            };
            fs.writeFileSync('/tmp/core-v08-one-shot/final-report.json', JSON.stringify(report, null, 2));
            console.log(JSON.stringify(report, null, 2));
            if (!cronOk) throw new Error('Cron present ou reponse schedules invalide apres ONE-SHOT');
            if (curlExit !== 0) throw new Error('POST termine dans un etat inconnu; aucun retry effectue');
            if (http !== 200 || response?.ok !== true) throw new Error(`POST en echec HTTP ${http}`);
            if (statusHttp !== 200) throw new Error(`GET status en echec HTTP ${statusHttp}`);
            if (!last.completedAt || last.completedAt === process.env.LAST_SYNC_BEFORE) throw new Error('Nouvelle synchronisation non confirmee par lastSync');
          })().catch(e => { console.error(e.message); process.exit(1); });
          NODE

      - name: Publish one-shot report
        if: always()
        shell: bash
        run: |
          {
            echo "## Premier ONE-SHOT Core v0.8"
            echo
            if [ -f /tmp/precheck.json ]; then
              echo "Precontrole Cloudflare: REUSSI"
            else
              echo "Precontrole Cloudflare: ECHEC — aucun POST envoye"
            fi
            if [ -f /tmp/core-v08-one-shot/final-report.json ]; then
              echo '```json'
              cat /tmp/core-v08-one-shot/final-report.json
              echo '```'
            fi
            echo "Deuxieme synchronisation: NON"
            echo "Deploiement: NON"
            echo "Mesure B: NON EFFECTUEE"
          } >> "$GITHUB_STEP_SUMMARY"
