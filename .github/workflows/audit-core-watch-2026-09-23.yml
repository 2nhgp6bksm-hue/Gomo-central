name: Core watch 2026-09-23 read-only
on:
  push:
    branches: [audit/core-watch-2026-09-23-0926]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CFPREVIEW }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PREVIEW || secrets.CLOUDFLARE_ACCOUNT_ID }}
      DB: gomo-core-db
    steps:
      - name: Resolve account
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            a="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts?per_page=50")"
            CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$a" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.success||j.result?.length!==1)process.exit(1);process.stdout.write(j.result[0].id)})')"
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Production status and Cron GET only
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS 'https://gomo-central.gjp86wh7p2.workers.dev/api/core/status?watch=20260923-0926' -o "$RUNNER_TEMP/status.json"
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/gomo-central"
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/schedules" -o "$RUNNER_TEMP/schedules.json"
          node - <<'NODE'
          const st=require(process.env.RUNNER_TEMP+'/status.json');
          const s=require(process.env.RUNNER_TEMP+'/schedules.json');
          const a=Array.isArray(s.result)?s.result:(s.result?.schedules||[]);
          console.log('WATCH_STATUS='+JSON.stringify({
            coreVersion:st.coreVersion,
            lastSuccessfulSync:st.lastSuccessfulSync,
            crons:a.map(x=>x.cron||x).filter(Boolean)
          }));
          NODE

      - name: Last 30 syncs SELECT only
        shell: bash
        run: |
          npx --yes wrangler@4.136.1 d1 execute "$DB" --remote --json --command "SELECT sync_id,started_at,completed_at,status,lastintel_status,lastrank_status,lastintel_members,lastrank_members,reconciled_members FROM core_sync_runs ORDER BY completed_at DESC LIMIT 30;"

      - name: 24h sync health SELECT only
        shell: bash
        run: |
          npx --yes wrangler@4.136.1 d1 execute "$DB" --remote --json --command "SELECT COUNT(*) AS syncs_24h,SUM(CASE WHEN status='ok' THEN 1 ELSE 0 END) AS ok_24h,SUM(CASE WHEN status<>'ok' THEN 1 ELSE 0 END) AS failed_24h,MIN(completed_at) AS first_24h,MAX(completed_at) AS last_24h FROM core_sync_runs WHERE completed_at >= datetime('now','-24 hours');"

      - name: Current source freshness SELECT only
        shell: bash
        run: |
          npx --yes wrangler@4.136.1 d1 execute "$DB" --remote --json --command "SELECT source,COUNT(*) AS rows,MAX(observed_at) AS max_observed_at,COUNT(DISTINCT observed_at) AS distinct_observed_at FROM core_current_source_state GROUP BY source ORDER BY source;"

      - name: Watched memberships SELECT only
        shell: bash
        run: |
          npx --yes wrangler@4.136.1 d1 execute "$DB" --remote --json --command "SELECT m.current_name,m.active,mm.status,mm.confirmation_syncs,mm.missing_syncs,mm.status_updated_at FROM core_members m JOIN core_member_membership mm ON mm.gomo_id=m.gomo_id WHERE m.current_name IN ('B4RR4CVD4','SaNi36','Weakl') ORDER BY m.current_name;"

      - name: Departures since Core v0.8.1 activation SELECT only
        shell: bash
        run: |
          npx --yes wrangler@4.136.1 d1 execute "$DB" --remote --json --command "SELECT m.current_name,m.active,mm.status,mm.missing_syncs,mm.status_updated_at FROM core_members m JOIN core_member_membership mm ON mm.gomo_id=m.gomo_id WHERE mm.status='departed' AND mm.status_updated_at >= '2026-09-22T07:00:00.000Z' ORDER BY mm.status_updated_at;"

      - name: Membership state counts SELECT only
        shell: bash
        run: |
          npx --yes wrangler@4.136.1 d1 execute "$DB" --remote --json --command "SELECT status,COUNT(*) AS members FROM core_member_membership GROUP BY status ORDER BY status;"
