name: Core watch auto 2026-09-23 1753Z read-only
on:
  push:
    branches: [audit/core-watch-auto-2026-09-23-1753z]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CFPREVIEW }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PREVIEW || secrets.CLOUDFLARE_ACCOUNT_ID }}
      DB: gomo-core-db
    steps:
      - name: Resolve account
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            a="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts?per_page=50")"
            CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$a" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.success||j.result?.length!==1)process.exit(1);process.stdout.write(j.result[0].id)})')"
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Production status and Cron GET only
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS 'https://gomo-central.gjp86wh7p2.workers.dev/api/core/status?watch=auto-20260924-0458z' -o "$RUNNER_TEMP/status.json"
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/gomo-central"
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/schedules" -o "$RUNNER_TEMP/schedules.json"
          node - <<'NODE'
          const st=require(process.env.RUNNER_TEMP+'/status.json');
          const s=require(process.env.RUNNER_TEMP+'/schedules.json');
          const a=Array.isArray(s.result)?s.result:(s.result?.schedules||[]);
          const ls=st.lastSuccessfulSync||{};
          const md=ls.metadata||{};
          const obs=md.d1Observability||{};
          console.log('WATCH_STATUS='+JSON.stringify({
            coreVersion:st.coreVersion,
            syncId:ls.syncId,
            completedAt:ls.completedAt,
            ageMinutes:ls.ageMinutes,
            fresh:ls.fresh,
            members:ls.members,
            sources:ls.sources,
            membershipAuthority:md.membershipAuthority,
            canonicalMembers:md.canonicalMembers,
            unionMembers:md.unionMembers,
            rowsChanged:md.rowsChanged,
            meaningfulRows:md.meaningfulRows,
            operationalBookkeepingRows:md.operationalBookkeepingRows,
            changesByStatement:md.changesByStatement,
            d1Queries:obs.queries,
            d1Operations:obs.operations,
            crons:a.map(x=>x.cron||x).filter(Boolean)
          }));
          NODE

      - name: Last 16 syncs and cadence SELECT only
        shell: bash
        run: |
          npx --yes wrangler@4.136.1 d1 execute "$DB" --remote --json --command "WITH x AS (SELECT sync_id,started_at,completed_at,status,lastintel_status,lastrank_status,lastintel_members,lastrank_members,reconciled_members FROM core_sync_runs ORDER BY completed_at DESC LIMIT 16), y AS (SELECT *,ROUND((julianday(completed_at)-julianday(LAG(completed_at) OVER (ORDER BY completed_at)))*24*60,2) AS minutes_since_previous FROM x) SELECT * FROM y ORDER BY completed_at DESC;"

      - name: Last 12h cadence summary SELECT only
        shell: bash
        run: |
          npx --yes wrangler@4.136.1 d1 execute "$DB" --remote --json --command "SELECT COUNT(*) AS syncs_12h,SUM(CASE WHEN status='ok' THEN 1 ELSE 0 END) AS ok_12h,SUM(CASE WHEN status<>'ok' THEN 1 ELSE 0 END) AS failed_12h,COUNT(DISTINCT substr(completed_at,1,13)) AS distinct_hours,MIN(completed_at) AS first_12h,MAX(completed_at) AS last_12h FROM core_sync_runs WHERE completed_at >= datetime('now','-12 hours');"

      - name: Duplicate sync hours last 12h SELECT only
        shell: bash
        run: |
          npx --yes wrangler@4.136.1 d1 execute "$DB" --remote --json --command "SELECT substr(completed_at,1,13) AS hour_utc,COUNT(*) AS syncs FROM core_sync_runs WHERE completed_at >= datetime('now','-12 hours') GROUP BY substr(completed_at,1,13) HAVING COUNT(*)>1 ORDER BY hour_utc;"

      - name: Current source freshness SELECT only
        shell: bash
        run: |
          npx --yes wrangler@4.136.1 d1 execute "$DB" --remote --json --command "SELECT source,COUNT(*) AS rows,MAX(observed_at) AS max_observed_at,COUNT(DISTINCT observed_at) AS distinct_observed_at FROM core_current_source_state GROUP BY source ORDER BY source;"

      - name: Watched memberships SELECT only
        shell: bash
        run: |
          npx --yes wrangler@4.136.1 d1 execute "$DB" --remote --json --command "SELECT m.current_name,m.active,mm.status,mm.confirmation_syncs,mm.missing_syncs,mm.status_updated_at FROM core_members m JOIN core_member_membership mm ON mm.gomo_id=m.gomo_id WHERE m.current_name IN ('B4RR4CVD4','SaNi36','Weakl') ORDER BY m.current_name;"

      - name: Departures since Core v0.8.1 activation SELECT only
        shell: bash
        run: |
          npx --yes wrangler@4.136.1 d1 execute "$DB" --remote --json --command "SELECT m.current_name,m.active,mm.status,mm.missing_syncs,mm.status_updated_at FROM core_members m JOIN core_member_membership mm ON mm.gomo_id=m.gomo_id WHERE mm.status='departed' AND mm.status_updated_at >= '2026-09-22T07:00:00.000Z' ORDER BY mm.status_updated_at;"

      - name: Membership state counts SELECT only
        shell: bash
        run: |
          npx --yes wrangler@4.136.1 d1 execute "$DB" --remote --json --command "SELECT status,COUNT(*) AS members FROM core_member_membership GROUP BY status ORDER BY status;"

      - name: Canonical growth last 12h SELECT only
        shell: bash
        run: |
          npx --yes wrangler@4.136.1 d1 execute "$DB" --remote --json --command "SELECT COUNT(*) AS canonical_snapshots_12h,COUNT(DISTINCT substr(observed_at,1,13)) AS hours_with_snapshots,MIN(observed_at) AS first_observed,MAX(observed_at) AS last_observed FROM core_canonical_snapshots WHERE observed_at >= datetime('now','-12 hours');"

# monitor rerun 2026-09-24 04:58Z
