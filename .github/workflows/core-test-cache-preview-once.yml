name: One-shot Core test cache preview

on:
  push:
    branches:
      - test/core-d1-read-optimization
    paths:
      - .github/workflows/core-test-cache-preview-once.yml

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CFPREVIEW }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PREVIEW || secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER: gomo-core-test
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: test/core-d1-read-optimization
          fetch-depth: 0
          persist-credentials: false

      - name: Lock scope and validate locally
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor d4e0ee3b5f074d624d7ba33bbe11b2722cc35572 HEAD
          test "$(node -p "require('./wrangler.jsonc'.replace('.jsonc','.json'))" 2>/dev/null || true)" = "" || true
          grep -q '"name": "gomo-core-test"' wrangler.jsonc
          grep -q '"main": "gomo-core-entry-v071.js"' wrangler.jsonc
          node --check gomo-core-entry-v07.js
          node --check gomo-core-entry-v071.js
          npm test

      - name: Snapshot active deployment and Cron read-only
        id: before
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            accounts="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts?per_page=50")"
            CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$accounts" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.success||j.result?.length!==1)process.exit(1);process.stdout.write(j.result[0].id)})')"
            echo "CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID" >> "$GITHUB_ENV"
          fi
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER"
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/deployments" > before-deployments.json
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/schedules" > before-schedules.json
          node - <<'NODE'
          const fs=require('fs');
          for (const f of ['before-deployments.json','before-schedules.json']) {
            const j=JSON.parse(fs.readFileSync(f)); if(!j.success) process.exit(1);
          }
          const s=JSON.parse(fs.readFileSync('before-schedules.json')).result;
          const list=Array.isArray(s)?s:(s?.schedules||[]);
          if(list.length!==1 || list[0].cron!=='15 * * * *') throw new Error('Unexpected Core test Cron state');
          console.log('BEFORE_CRON='+JSON.stringify(list));
          NODE

      - name: Upload preview version only — no active deployment, no triggers
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest versions upload --name "$WORKER" --preview-alias cache-fail-open --keep-vars 2>&1 | tee preview-upload.log
          preview_url="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' preview-upload.log | tail -1 || true)"
          if [ -z "$preview_url" ]; then
            preview_url="$(grep -Eo '[A-Za-z0-9._-]+\.workers\.dev' preview-upload.log | tail -1 || true)"
            [ -n "$preview_url" ] && preview_url="https://$preview_url"
          fi
          test -n "$preview_url"
          echo "PREVIEW_URL=$preview_url" >> "$GITHUB_ENV"
          echo "CORE_PREVIEW_URL=$preview_url"

      - name: Smoke test preview GET-only
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PREVIEW_URL:-}"
          for path in status members power; do
            curl --fail --silent --show-error --retry 0 --max-time 30 \
              -D "$path.headers" "$PREVIEW_URL/api/core/$path" -o "$path.json"
          done
          node - <<'NODE'
          const fs=require('fs');
          const status=JSON.parse(fs.readFileSync('status.json'));
          const members=JSON.parse(fs.readFileSync('members.json'));
          const power=JSON.parse(fs.readFileSync('power.json'));
          if(status.ok!==true) throw new Error('status not ok');
          if(members.memberCount!==94 || !Array.isArray(members.members) || members.members.length!==94) throw new Error(`members count ${members.memberCount}`);
          if(power.memberCount!==94 || !Array.isArray(power.members) || power.members.length!==94) throw new Error(`power count ${power.memberCount}`);
          if(members.coreVersion!=='0.8.0-read-optimization-test' || power.coreVersion!=='0.8.0-read-optimization-test') throw new Error('unexpected Core version');
          const summary={status:status.ok,members:members.memberCount,power:power.memberCount,coreVersion:members.coreVersion,membersCache:fs.readFileSync('members.headers','utf8').match(/x-gomo-core-cache:\s*(\S+)/i)?.[1]||null,powerCache:fs.readFileSync('power.headers','utf8').match(/x-gomo-core-cache:\s*(\S+)/i)?.[1]||null};
          console.log('CORE_PREVIEW_SMOKE='+JSON.stringify(summary));
          NODE

      - name: Prove active deployment and Cron unchanged
        shell: bash
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER"
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/deployments" > after-deployments.json
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/schedules" > after-schedules.json
          node - <<'NODE'
          const fs=require('fs');
          const beforeD=JSON.parse(fs.readFileSync('before-deployments.json'));
          const afterD=JSON.parse(fs.readFileSync('after-deployments.json'));
          const beforeS=JSON.parse(fs.readFileSync('before-schedules.json'));
          const afterS=JSON.parse(fs.readFileSync('after-schedules.json'));
          if(!afterD.success||!afterS.success) process.exit(1);
          if(JSON.stringify(beforeD.result)!==JSON.stringify(afterD.result)) throw new Error('Active deployment changed');
          if(JSON.stringify(beforeS.result)!==JSON.stringify(afterS.result)) throw new Error('Cron state changed');
          console.log('CORE_PREVIEW_INVARIANTS='+JSON.stringify({activeDeploymentUnchanged:true,cronUnchanged:true}));
          NODE
