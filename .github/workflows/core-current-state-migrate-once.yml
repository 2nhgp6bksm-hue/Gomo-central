name: One-shot Core current-state migration and preview validation

on:
  push:
    branches:
      - test/core-d1-read-optimization
    paths:
      - .github/workflows/core-current-state-migrate-once.yml

permissions:
  contents: read

concurrency:
  group: gomo-core-current-state-production-d1-once
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CFPREVIEW }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PREVIEW || secrets.CLOUDFLARE_ACCOUNT_ID }}
      DB_ID: ac1b5094-c1f9-4706-b29b-8507e6f85a92
      WORKER: gomo-core-test
      EXPECTED_ACTIVE_VERSION: fe297cda-d6fe-460b-b3da-ebbc5983e3ca
      EXPECTED_CRON: '15 * * * *'
      PREVIEW_URL: https://cache-fail-open-gomo-core-test.gjp86wh7p2.workers.dev
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: test/core-d1-read-optimization
          fetch-depth: 0
          persist-credentials: false

      - name: Lock scope and validate files locally
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          git merge-base --is-ancestor d4e0ee3b5f074d624d7ba33bbe11b2722cc35572 HEAD
          test -f migrations/0003_gomo_core_current_state.sql
          test -f validation/backfill-current-state.sql
          test -f validation/prod-current-state-migrate-once.mjs
          grep -q 'CREATE TABLE IF NOT EXISTS core_current_members' migrations/0003_gomo_core_current_state.sql
          grep -q 'CREATE TABLE IF NOT EXISTS core_current_source_state' migrations/0003_gomo_core_current_state.sql
          grep -q 'INSERT INTO core_current_members' validation/backfill-current-state.sql
          grep -q 'INSERT INTO core_current_source_state' validation/backfill-current-state.sql
          if grep -Eiq '\b(DROP|DELETE|ALTER|TRUNCATE|VACUUM|ATTACH|DETACH|REPLACE)\b' migrations/0003_gomo_core_current_state.sql validation/backfill-current-state.sql; then
            echo 'Forbidden destructive SQL token found'
            exit 1
          fi
          node --check validation/prod-current-state-migrate-once.mjs
          npm test

      - name: Resolve Cloudflare account only
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            accounts="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts?per_page=50")"
            account_id="$(printf '%s' "$accounts" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.success||j.result?.length!==1)process.exit(1);process.stdout.write(j.result[0].id)})')"
            echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"
          fi

      - name: Apply additive migration, backfill, and preview smoke test
        shell: bash
        run: |
          set -euo pipefail
          node validation/prod-current-state-migrate-once.mjs

      - name: Publish migration report
        if: always()
        shell: bash
        run: |
          echo '## GoMo Core current-state migration' >> "$GITHUB_STEP_SUMMARY"
          echo '- Active Worker deployment requested: `false`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Cron modification requested: `false`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Main modification requested: `false`' >> "$GITHUB_STEP_SUMMARY"
          if [ -f migration-results/report.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat migration-results/report.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gomo-core-current-state-migration-evidence
          path: migration-results/
          if-no-files-found: warn
          retention-days: 30
