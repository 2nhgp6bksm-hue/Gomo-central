name: Redeploy Core v0.8.1 production clean assets only

on:
  push:
    branches: [deploy/core-v081-production-clean-assets-2026-09-22]

concurrency:
  group: deploy-core-v081-production-clean-assets
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  clean-redeploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CFPREVIEW }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PREVIEW || secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER: gomo-central
      EXPECTED_VERSION: e061ebaa-ec53-4123-9e38-5174074e6e1d
      EXPECTED_DEPLOYMENT: 14bfe6c7-3542-491d-a43e-7302f2472b4e
      EXPECTED_SYNC: sync6_1789370115343_1d930c76
    steps:
      - name: Checkout exact validated production candidate
        uses: actions/checkout@v4
        with:
          ref: 2adc9e70891567a95be8cd9c194b3d45fc094a44
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "2adc9e70891567a95be8cd9c194b3d45fc094a44"
          node validation/core-v081-production-config-guard.mjs
          npm test
          node --check gomo-core-entry-lastwarrank.js
          node --check gomo-core-entry-v07.js
          node --check gomo-core-v06-storage.js
          node --check gomo-core-d1-observability.js
          node - <<'NODE'
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('wrangler.production.jsonc','utf8'));
          if(c.name!=='gomo-central') throw Error('Wrong Worker');
          if(c.d1_databases?.[0]?.database_id!=='ac1b5094-c1f9-4706-b29b-8507e6f85a92') throw Error('Wrong production D1');
          if(c.vars?.CORE_CURRENT_READS!=='1') throw Error('CORE_CURRENT_READS not enabled');
          if(c.triggers!==undefined||c.crons!==undefined) throw Error('Cron config must be absent');
          NODE
          for f in deployments-before.json schedules-before.json status-before.json deployments-after.json schedules-after.json status-after.json members-after.json power-after.json; do
            test ! -e "$f" || { echo "Temporary asset exists in repository root: $f"; exit 1; }
          done

      - name: Resolve Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            accounts="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts?per_page=50")"
            CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$accounts" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.success||j.result?.length!==1)process.exit(1);process.stdout.write(j.result[0].id)})')"
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Preflight in runner temp only
        shell: bash
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER"
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/deployments" -o "$RUNNER_TEMP/deployments-before.json"
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/schedules" -o "$RUNNER_TEMP/schedules-before.json"
          curl -fsS "https://gomo-central.gjp86wh7p2.workers.dev/api/core/status?clean-preflight=v081-20260922" -o "$RUNNER_TEMP/status-before.json"
          node - <<'NODE'
          const d=require(process.env.RUNNER_TEMP+'/deployments-before.json');
          const s=require(process.env.RUNNER_TEMP+'/schedules-before.json');
          const st=require(process.env.RUNNER_TEMP+'/status-before.json');
          if(!d.success||!s.success) throw Error('Cloudflare preflight failed');
          const deployments=Array.isArray(d.result)?d.result:(d.result?.deployments||[]);
          const current=deployments[0];
          const live=current?.versions?.find(v=>Number(v.percentage)===100);
          const schedules=Array.isArray(s.result)?s.result:(s.result?.schedules||[]);
          if(current?.id!==process.env.EXPECTED_DEPLOYMENT) throw Error('Deployment changed; STOP');
          if(live?.version_id!==process.env.EXPECTED_VERSION) throw Error('Version changed; STOP');
          if(schedules.length!==0) throw Error('Cron present; STOP');
          if(st.coreVersion!=='0.8.1-fail-stable-test') throw Error('Unexpected Core version');
          if(st.safety?.currentStateReads!==true) throw Error('Current-state reads disabled');
          if(st.lastSuccessfulSync?.syncId!==process.env.EXPECTED_SYNC) throw Error('Sync changed; STOP');
          if(st.lastSuccessfulSync?.members!==94) throw Error('Stored member count changed');
          console.log(JSON.stringify({deployment:current.id,version:live.version_id,traffic:live.percentage,crons:[],syncId:st.lastSuccessfulSync.syncId,members:st.lastSuccessfulSync.members},null,2));
          NODE

      - name: Redeploy exact same candidate once
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.136.1 deploy --config wrangler.production.jsonc

      - name: Post-deploy Core GET checks in runner temp only
        shell: bash
        run: |
          set -euo pipefail
          for ep in status members power; do
            code="$(curl -sS -o "$RUNNER_TEMP/$ep-after.json" -w '%{http_code}' "https://gomo-central.gjp86wh7p2.workers.dev/api/core/$ep?clean-postdeploy=v081-20260922")"
            echo "$ep HTTP $code"
            test "$code" = 200
          done
          node - <<'NODE'
          const status=require(process.env.RUNNER_TEMP+'/status-after.json');
          const members=require(process.env.RUNNER_TEMP+'/members-after.json');
          const power=require(process.env.RUNNER_TEMP+'/power-after.json');
          if(status.coreVersion!=='0.8.1-fail-stable-test') throw Error('Unexpected Core version');
          if(status.safety?.currentStateReads!==true) throw Error('Current-state reads disabled');
          if(status.lastSuccessfulSync?.syncId!==process.env.EXPECTED_SYNC) throw Error('A synchronization occurred; STOP');
          if(status.lastSuccessfulSync?.members!==94) throw Error('Stored member count changed');
          if(!Array.isArray(members.members)||members.members.length!==94) throw Error('Expected 94 public members');
          if(!Array.isArray(power.members)||power.members.length!==94) throw Error('Expected 94 public power members');
          console.log(JSON.stringify({coreVersion:status.coreVersion,currentStateReads:true,syncId:status.lastSuccessfulSync.syncId,publicMembers:members.members.length,publicPowerMembers:power.members.length},null,2));
          NODE

      - name: Verify temporary assets are gone
        shell: bash
        run: |
          set -euo pipefail
          base='https://gomo-central.gjp86wh7p2.workers.dev'
          for file in deployments-before.json schedules-before.json status-before.json; do
            code="$(curl -sS -o "$RUNNER_TEMP/$file.body" -w '%{http_code}' "$base/$file?clean-check=20260922")"
            echo "$file HTTP=$code"
            test "$code" = 404 || { echo "Temporary asset still publicly served: $file"; exit 1; }
          done

      - name: Capture new deployment and Cron state in runner temp only
        shell: bash
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER"
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/deployments" -o "$RUNNER_TEMP/deployments-after.json"
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/schedules" -o "$RUNNER_TEMP/schedules-after.json"
          node - <<'NODE'
          const d=require(process.env.RUNNER_TEMP+'/deployments-after.json');
          const s=require(process.env.RUNNER_TEMP+'/schedules-after.json');
          if(!d.success||!s.success) throw Error('Post-deploy metadata failed');
          const deployments=Array.isArray(d.result)?d.result:(d.result?.deployments||[]);
          const current=deployments[0];
          const live=current?.versions?.find(v=>Number(v.percentage)===100);
          const schedules=Array.isArray(s.result)?s.result:(s.result?.schedules||[]);
          if(!current?.id||!live?.version_id) throw Error('New deployment metadata unavailable');
          if(current.id===process.env.EXPECTED_DEPLOYMENT) throw Error('No new deployment detected');
          if(schedules.length!==0) throw Error('Cron unexpectedly present');
          console.log(JSON.stringify({
            newDeploymentId:current.id,
            newVersionId:live.version_id,
            traffic:live.percentage,
            crons:[],
            immediateRollbackVersion:process.env.EXPECTED_VERSION,
            immediateRollbackDeployment:process.env.EXPECTED_DEPLOYMENT,
            stableRollbackVersion:'8cc05aa0-ca62-4d37-b176-81eb180728be',
            stableRollbackDeployment:'10b48eba-6c47-4057-9343-911efbb020e4'
          },null,2));
          NODE
