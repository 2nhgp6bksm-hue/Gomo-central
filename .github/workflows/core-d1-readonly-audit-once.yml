name: One-shot Core D1 read-only audit

on:
  push:
    branches:
      - test/core-d1-read-optimization
    paths:
      - .github/workflows/core-d1-readonly-audit-once.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CFPREVIEW }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PREVIEW || secrets.CLOUDFLARE_ACCOUNT_ID }}
      DB_ID: ac1b5094-c1f9-4706-b29b-8507e6f85a92
    steps:
      - name: Execute strictly read-only D1 audit
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            accounts="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts?per_page=50")"
            CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$accounts" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.success||j.result?.length!==1)process.exit(1);process.stdout.write(j.result[0].id)})')"
          fi
          export CLOUDFLARE_ACCOUNT_ID
          endpoint="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$DB_ID/query"
          mkdir -p d1-audit

          query() {
            name="$1"
            sql="$2"
            printf '%s' "$sql" | grep -Eiq '^([[:space:]]*SELECT|[[:space:]]*PRAGMA[[:space:]]+table_info|[[:space:]]*PRAGMA[[:space:]]+index_list)'
            if printf '%s' "$sql" | grep -Eiq '\b(INSERT|UPDATE|DELETE|CREATE|ALTER|DROP|REPLACE|VACUUM|REINDEX|ATTACH|DETACH)\b'; then
              echo "Forbidden SQL token detected in $name"
              exit 1
            fi
            payload="$(SQL="$sql" node -e 'process.stdout.write(JSON.stringify({sql:process.env.SQL,params:[]}))')"
            code="$(curl --silent --show-error --retry 0 --max-time 30 \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' \
              --data "$payload" \
              -o "d1-audit/$name.json" -w '%{http_code}' "$endpoint")"
            echo "$name HTTP $code"
            echo "${name}_BODY=$(cat "d1-audit/$name.json")"
            test "$code" = "200"
            FILE="d1-audit/$name.json" node -e 'const fs=require("fs");const j=JSON.parse(fs.readFileSync(process.env.FILE,"utf8"));if(!j.success)throw Error(JSON.stringify(j.errors||j));'
          }

          query tables "SELECT name,type FROM sqlite_master WHERE type='table' AND name IN ('core_current_members','core_current_source_state','core_sync_runs','core_sync_metadata') ORDER BY name"
          query current_members_columns "PRAGMA table_info(core_current_members)"
          query current_source_columns "PRAGMA table_info(core_current_source_state)"
          query current_members_indexes "PRAGMA index_list(core_current_members)"

          has_members="$(FILE=d1-audit/tables.json node -e 'const fs=require("fs");const j=JSON.parse(fs.readFileSync(process.env.FILE,"utf8"));const a=(Array.isArray(j.result)?j.result:[j.result]).flatMap(x=>x?.results||[]);process.stdout.write(a.some(x=>x.name==="core_current_members")?"1":"0")')"
          has_source="$(FILE=d1-audit/tables.json node -e 'const fs=require("fs");const j=JSON.parse(fs.readFileSync(process.env.FILE,"utf8"));const a=(Array.isArray(j.result)?j.result:[j.result]).flatMap(x=>x?.results||[]);process.stdout.write(a.some(x=>x.name==="core_current_source_state")?"1":"0")')"

          if [ "$has_members" = "1" ]; then
            query current_count "SELECT COUNT(*) AS total_rows FROM core_current_members"
            query active_count "SELECT COUNT(*) AS active_rows FROM core_current_members WHERE active=1"
            query public_count "SELECT COUNT(*) AS public_rows FROM core_current_members WHERE active=1 AND membership_status!='departed'"
          fi
          if [ "$has_source" = "1" ]; then
            query current_source_count "SELECT COUNT(*) AS source_rows FROM core_current_source_state"
          fi

          node - <<'NODE'
          const fs=require('fs');
          const exists=(name)=>fs.existsSync(`d1-audit/${name}.json`);
          const read=(name)=>JSON.parse(fs.readFileSync(`d1-audit/${name}.json`,'utf8'));
          const rows=(name)=>{
            if(!exists(name)) return [];
            const j=read(name);
            const r=Array.isArray(j.result)?j.result:[j.result];
            return r.flatMap(x=>x?.results||[]);
          };
          const tables=rows('tables').map(x=>x.name).sort();
          const memberColumns=rows('current_members_columns').map(x=>x.name);
          const sourceColumns=rows('current_source_columns').map(x=>x.name);
          const indexes=rows('current_members_indexes').map(x=>x.name);
          const requiredMembers=['gomo_id','name','rank','hq','max_hq','power','hero_power','kills','avatar_url','confidence','confidence_level','flags_json','field_sources_json','observed_at','active','membership_status','updated_sync_id','updated_at'];
          const requiredSource=['source','source_member_id','gomo_id','name','rank','hq','power','hero_power','kills','avatar_url','observed_at','updated_sync_id','updated_at'];
          const number=(name,key)=>Number(rows(name)[0]?.[key]||0);
          const report={
            databaseId:process.env.DB_ID,
            tables,
            memberColumns,
            sourceColumns,
            indexes,
            counts:{
              total:exists('current_count')?number('current_count','total_rows'):null,
              active:exists('active_count')?number('active_count','active_rows'):null,
              public:exists('public_count')?number('public_count','public_rows'):null,
              sourceRows:exists('current_source_count')?number('current_source_count','source_rows'):null
            },
            missingMemberColumns:requiredMembers.filter(x=>!memberColumns.includes(x)),
            extraMemberColumns:memberColumns.filter(x=>!requiredMembers.includes(x)),
            missingSourceColumns:requiredSource.filter(x=>!sourceColumns.includes(x)),
            extraSourceColumns:sourceColumns.filter(x=>!requiredSource.includes(x)),
            readOnly:true
          };
          fs.writeFileSync('d1-audit/report.json',JSON.stringify(report,null,2)+'\n');
          console.log('CORE_D1_READONLY_AUDIT='+JSON.stringify(report));
          NODE

      - name: Publish audit summary
        if: always()
        shell: bash
        run: |
          echo '## Core D1 read-only audit' >> "$GITHUB_STEP_SUMMARY"
          if [ -f d1-audit/report.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat d1-audit/report.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
