name: Core v0.8.1 cadence audit SELECT-only
on:
  push:
    branches: [audit/core-v081-cadence-2026-09-22]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CFPREVIEW }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PREVIEW || secrets.CLOUDFLARE_ACCOUNT_ID }}
      DB: gomo-core-db
    steps:
      - name: Resolve account
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            a="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts?per_page=50")"
            CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$a" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.success||j.result?.length!==1)process.exit(1);process.stdout.write(j.result[0].id)})')"
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID" >> "$GITHUB_ENV"
      - name: Current source freshness SELECT only
        run: |
          npx --yes wrangler@4.136.1 d1 execute "$DB" --remote --json --command "SELECT source,COUNT(*) rows,MIN(observed_at) min_observed_at,MAX(observed_at) max_observed_at,COUNT(DISTINCT observed_at) distinct_observed_at FROM core_current_source_state GROUP BY source ORDER BY source;"
      - name: Recent successful sync intervals SELECT only
        run: |
          npx --yes wrangler@4.136.1 d1 execute "$DB" --remote --json --command "SELECT sync_id,completed_at,lastintel_members,lastrank_members FROM core_sync_runs WHERE status='ok' ORDER BY completed_at DESC LIMIT 12;"
      - name: Confirm Cron absent GET only
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/gomo-central"
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/schedules" -o "$RUNNER_TEMP/s.json"
          node - <<'NODE'
          const j=require(process.env.RUNNER_TEMP+'/s.json'); const a=Array.isArray(j.result)?j.result:(j.result?.schedules||[]);
          console.log(JSON.stringify({crons:a.map(x=>x.cron||x).filter(Boolean)},null,2));
          if(a.length) process.exit(1);
          NODE
