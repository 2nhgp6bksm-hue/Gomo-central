name: Deploy GoMo Core test once

on:
  push:
    branches:
      - test/gomo-core
    paths:
      - .github/workflows/gomo-core-test-deploy-once.yml

permissions:
  contents: read

concurrency:
  group: deploy-gomo-core-test
  cancel-in-progress: false

jobs:
  deploy-test-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout the authorized test branch
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Assert the test-only deployment target
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "2nhgp6bksm-hue/Gomo-central"
          test "$GITHUB_REF" = "refs/heads/test/gomo-core"
          node <<'NODE'
          const fs = require("node:fs");
          const config = JSON.parse(fs.readFileSync("wrangler.jsonc", "utf8"));
          const assistant = (config.services || []).find((item) => item.binding === "GOMO_ASSISTANT");
          if (config.name !== "gomo-core-test") throw new Error("Forbidden Worker target");
          if (config.main !== "gomo-core-entry-v071.js") throw new Error("Unexpected entrypoint");
          if (config.kv_namespaces) throw new Error("Avatar KV is forbidden");
          if (config.r2_buckets) throw new Error("Avatar R2 is forbidden");
          if (assistant?.service !== "gomo-assistant-v2") throw new Error("Assistant binding is missing");
          console.log("Authorized target: gomo-core-test only");
          NODE
          npm test
          node --check gomo-core-avatars.js
          node --check gomo-core-entry-v07.js
          node --check gomo-core-entry-v071.js

      - name: Require preconfigured Cloudflare CI credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID repository secret; nothing was deployed."
            exit 1
          fi

      - name: Record the current gomo-core-test deployment
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.127.0 deployments status --name gomo-core-test --json

      - name: Repeat the final Wrangler dry run
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.127.0 deploy --dry-run --outdir "$RUNNER_TEMP/gomo-core-dry-run"

      - name: Deploy and audit gomo-core-test with automatic rollback
        shell: bash
        run: |
          set -euo pipefail
          deployed=0
          rollback_on_error() {
            code=$?
            if [[ "$code" -ne 0 && "$deployed" -eq 1 ]]; then
              echo "::warning::Post-deployment audit failed; restoring the previous gomo-core-test version."
              set +e
              npx --yes wrangler@4.127.0 rollback --name gomo-core-test --message "Automatic rollback after v0.7.2 test audit failure"
              rollback_code=$?
              set -e
              if [[ "$rollback_code" -ne 0 ]]; then
                echo "::error::Automatic rollback failed and requires immediate manual review."
              fi
            fi
            exit "$code"
          }
          trap rollback_on_error EXIT

          npx --yes wrangler@4.127.0 deploy \
            --name gomo-core-test \
            --keep-vars \
            --message "test/gomo-core v0.7.2 central Assistant avatars"
          deployed=1

          node <<'NODE'
          const CORE_ORIGIN = "https://gomo-core-test.gjp86wh7p2.workers.dev";
          const ASSISTANT_CATALOG = "https://gomo-assistant-v2.gjp86wh7p2.workers.dev/api/public/members";
          const EXPECTED_VERSION = "0.7.2-test";
          const EXPECTED_MEMBERS = 96;
          const GOMO_ID = /^gomo_[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;

          const sleep = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));
          const ensure = (condition, message) => {
            if (!condition) throw new Error(message);
          };
          async function request(url, attempts = 3) {
            let lastError;
            for (let attempt = 1; attempt <= attempts; attempt += 1) {
              try {
                const response = await fetch(url, {
                  cache: "no-store",
                  headers: { "user-agent": "gomo-core-test-live-audit/0.7.2" },
                  signal: AbortSignal.timeout(20000),
                });
                if (response.status < 500 && response.status !== 429) return response;
                lastError = new Error(`${url} returned HTTP ${response.status}`);
              } catch (error) {
                lastError = error;
              }
              if (attempt < attempts) await sleep(attempt * 1500);
            }
            throw lastError;
          }

          let corePayload = null;
          for (let attempt = 1; attempt <= 12; attempt += 1) {
            const response = await request(`${CORE_ORIGIN}/api/core/members?deployAudit=${Date.now()}`);
            ensure(response.ok, `Core members HTTP ${response.status}`);
            const candidate = await response.json();
            if (candidate.coreVersion === EXPECTED_VERSION) {
              corePayload = candidate;
              break;
            }
            await sleep(5000);
          }
          ensure(corePayload, `Core ${EXPECTED_VERSION} did not become active`);

          const assistantResponse = await request(`${ASSISTANT_CATALOG}?deployAudit=${Date.now()}`);
          ensure(assistantResponse.ok, `Assistant catalog HTTP ${assistantResponse.status}`);
          const assistantPayload = await assistantResponse.json();
          const assistantMembers = Array.isArray(assistantPayload.members) ? assistantPayload.members : [];
          const assistantById = new Map();
          for (const member of assistantMembers) {
            const id = String(member.gomo_id || "").toLowerCase();
            ensure(GOMO_ID.test(id), `Invalid Assistant gomoId: ${id}`);
            ensure(!assistantById.has(id), `Duplicate Assistant gomoId: ${id}`);
            assistantById.set(id, member);
          }

          ensure(corePayload.ok === true, "Core members is not OK");
          ensure(corePayload.memberCount === EXPECTED_MEMBERS, `Expected ${EXPECTED_MEMBERS} Core members`);
          ensure(corePayload.avatarContractVersion === 1, "Avatar contract is missing");
          ensure(corePayload.avatarStats?.matched === EXPECTED_MEMBERS, "Not all members have a central avatar");
          ensure(corePayload.avatarStats?.matchedByGomoId === EXPECTED_MEMBERS, "Not all matches use gomoId");
          ensure(corePayload.avatarStats?.matchedByPseudo === 0, "Unexpected pseudo fallback");
          ensure(corePayload.avatarStats?.missing === 0, "Missing central avatars");
          ensure(corePayload.avatarStats?.ambiguous === 0, "Ambiguous avatar associations");
          ensure(
            Number(corePayload.avatarStats?.central || 0) + Number(corePayload.avatarStats?.library || 0) === EXPECTED_MEMBERS,
            "Invalid central/library avatar totals",
          );
          ensure(assistantById.size === EXPECTED_MEMBERS, `Expected ${EXPECTED_MEMBERS} unique Assistant members`);

          const coreIds = new Set();
          const avatarUrls = [];
          for (const member of corePayload.members || []) {
            const id = String(member.gomoId || "").toLowerCase();
            ensure(GOMO_ID.test(id), `Invalid Core gomoId: ${id}`);
            ensure(!coreIds.has(id), `Duplicate Core gomoId: ${id}`);
            coreIds.add(id);
            const assistant = assistantById.get(id);
            ensure(assistant, `No Assistant member for ${id}`);
            ensure(member.avatarMatch === "gomoId", `Unsafe avatar match for ${id}`);
            ensure(Number(member.avatarVersion) === Number(assistant.avatar_version), `Avatar version mismatch for ${id}`);
            const expected = `${CORE_ORIGIN}/api/core/members/${encodeURIComponent(id)}/avatar?v=${Number(assistant.avatar_version)}`;
            ensure(member.avatarUrl === expected, `Wrong avatar URL for ${id}`);
            avatarUrls.push(expected);
          }
          ensure(coreIds.size === EXPECTED_MEMBERS, "Core member IDs are incomplete");

          let nextAvatar = 0;
          const avatarWorkers = Array.from({ length: 8 }, async () => {
            while (nextAvatar < avatarUrls.length) {
              const index = nextAvatar;
              nextAvatar += 1;
              const response = await request(avatarUrls[index], 3);
              ensure(response.ok, `Avatar HTTP ${response.status}: ${avatarUrls[index]}`);
              ensure(String(response.headers.get("content-type") || "").startsWith("image/"), `Avatar is not an image: ${avatarUrls[index]}`);
              ensure(response.headers.get("cache-control")?.includes("immutable"), `Avatar is not immutable: ${avatarUrls[index]}`);
              const bytes = await response.arrayBuffer();
              ensure(bytes.byteLength > 0, `Empty avatar: ${avatarUrls[index]}`);
            }
          });
          await Promise.all(avatarWorkers);

          const [statusResponse, powerResponse, precisionResponse, liveResponse, homeResponse, corePageResponse] = await Promise.all([
            request(`${CORE_ORIGIN}/api/core/status?deployAudit=${Date.now()}`),
            request(`${CORE_ORIGIN}/api/core/power?deployAudit=${Date.now()}`),
            request(`${CORE_ORIGIN}/api/core/precision?deployAudit=${Date.now()}`),
            request(`${CORE_ORIGIN}/api/core/live?deployAudit=${Date.now()}`),
            request(`${CORE_ORIGIN}/?deployAudit=${Date.now()}`),
            request(`${CORE_ORIGIN}/core/?deployAudit=${Date.now()}`),
          ]);
          ensure(statusResponse.ok, `Status route HTTP ${statusResponse.status}`);
          ensure(powerResponse.ok, `Power route HTTP ${powerResponse.status}`);
          ensure([200, 503].includes(precisionResponse.status), `Precision route HTTP ${precisionResponse.status}`);
          ensure(liveResponse.status === 401, `Live route must remain protected, got ${liveResponse.status}`);
          ensure(homeResponse.ok, `Home page HTTP ${homeResponse.status}`);
          ensure(corePageResponse.ok, `Core page HTTP ${corePageResponse.status}`);

          const statusPayload = await statusResponse.json();
          const powerPayload = await powerResponse.json();
          ensure(statusPayload.coreVersion === EXPECTED_VERSION, "Status route is on the wrong Core version");
          ensure(statusPayload.safety?.centralAvatarsUseAssistantBinding === true, "Assistant binding safety flag is missing");
          ensure(statusPayload.safety?.centralAvatarsCreateNoStorage === true, "No-storage safety flag is missing");
          ensure(powerPayload.coreVersion === EXPECTED_VERSION, "Power route is on the wrong Core version");
          ensure(powerPayload.memberCount === EXPECTED_MEMBERS, "Power route member count changed");
          ensure((powerPayload.members || []).every((member) => !("avatarUrl" in member)), "Power route unexpectedly loads avatars");

          console.log(JSON.stringify({
            event: "gomo_core_v072_live_audit_ok",
            members: coreIds.size,
            avatars: avatarUrls.length,
            matchedByGomoId: corePayload.avatarStats.matchedByGomoId,
            central: corePayload.avatarStats.central,
            library: corePayload.avatarStats.library,
            missing: corePayload.avatarStats.missing,
            ambiguous: corePayload.avatarStats.ambiguous,
          }));
          NODE

          trap - EXIT

