name: One-shot freshness-only canonical churn patch

on:
  push:
    branches:
      - test/core-d1-read-optimization
    paths:
      - .github/workflows/patch-freshness-only-canonical-once.yml

permissions:
  contents: write

jobs:
  patch-once:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch only
        uses: actions/checkout@v4
        with:
          ref: test/core-d1-read-optimization
          fetch-depth: 0

      - name: Suppress freshness-only moving-field churn
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('gomo-core-v06-storage.js')
          text = p.read_text()

          old_fn = '''function canonicalBusinessChanged(current, row) {
            if (!current) return true;
            return !same(current.name, row.name)
              || !same(current.rank, row.rank)
              || !same(current.hq, row.hq)
              || !same(current.power, row.power)
              || !same(current.hero_power, row.hero)
              || !same(current.kills, row.kills)
              || !same(current.avatar_url, row.avatar);
          }
          '''
          new_fn = '''function canonicalStableBusinessChanged(current, row) {
            if (!current) return true;
            return !same(current.name, row.name)
              || !same(current.rank, row.rank)
              || !same(current.hq, row.hq)
              || !same(current.kills, row.kills)
              || !same(current.avatar_url, row.avatar);
          }

          function canonicalMovingBusinessChanged(current, row) {
            if (!current) return true;
            return !same(current.power, row.power)
              || !same(current.hero_power, row.hero);
          }

          function canonicalBusinessChanged(current, row) {
            return canonicalStableBusinessChanged(current, row)
              || canonicalMovingBusinessChanged(current, row);
          }
          '''
          if text.count(old_fn) != 1:
              raise SystemExit(f'canonical business block count={text.count(old_fn)}')
          text = text.replace(old_fn, new_fn, 1)

          old_block = '''    const sourceChangedMembers = new Set(sourceChanges.map((row) => row.g));
              const canonicalChanges = p.canonical.filter((row) => canonicalBusinessChanged(state.currentMembers.get(row.g), row));
              const derivedMetadataRowsSuppressed = p.canonical.filter((row) => {
                const current = state.currentMembers.get(row.g);
                return current
                  && !canonicalBusinessChanged(current, row)
                  && canonicalDerivedChanged(current, row)
                  && !sourceChangedMembers.has(row.g);
              }).length;
              const currentMemberUpdates = p.canonical.filter((row) => {
                const current = state.currentMembers.get(row.g);
                const membership = nextMembership(state.members.get(row.g), true);
                return canonicalBusinessChanged(current, row)
                  || (canonicalDerivedChanged(current, row) && sourceChangedMembers.has(row.g))
                  || current?.max_hq == null
                  || (row.hq != null && Number(row.hq) > Number(current?.max_hq))
                  || Number(current?.active) !== 1
                  || !same(current?.membership_status, membership);
              });
          '''
          new_block = '''    const sourceChangedMembers = new Set(sourceChanges.map((row) => row.g));
              const canonicalChanges = p.canonical.filter((row) => {
                const current = state.currentMembers.get(row.g);
                return canonicalStableBusinessChanged(current, row)
                  || (canonicalMovingBusinessChanged(current, row) && sourceChangedMembers.has(row.g));
              });
              const freshnessOnlyCanonicalRowsSuppressed = p.canonical.filter((row) => {
                const current = state.currentMembers.get(row.g);
                return current
                  && !canonicalStableBusinessChanged(current, row)
                  && canonicalMovingBusinessChanged(current, row)
                  && !sourceChangedMembers.has(row.g);
              }).length;
              const derivedMetadataRowsSuppressed = p.canonical.filter((row) => {
                const current = state.currentMembers.get(row.g);
                return current
                  && !canonicalBusinessChanged(current, row)
                  && canonicalDerivedChanged(current, row)
                  && !sourceChangedMembers.has(row.g);
              }).length;
              const currentMemberUpdates = p.canonical.filter((row) => {
                const current = state.currentMembers.get(row.g);
                const membership = nextMembership(state.members.get(row.g), true);
                return canonicalStableBusinessChanged(current, row)
                  || (canonicalMovingBusinessChanged(current, row) && sourceChangedMembers.has(row.g))
                  || (canonicalDerivedChanged(current, row) && sourceChangedMembers.has(row.g))
                  || current?.max_hq == null
                  || (row.hq != null && Number(row.hq) > Number(current?.max_hq))
                  || Number(current?.active) !== 1
                  || !same(current?.membership_status, membership);
              });
          '''
          if text.count(old_block) != 1:
              raise SystemExit(f'comparison block count={text.count(old_block)}')
          text = text.replace(old_block, new_block, 1)

          metric_anchor = '      derivedMetadataRowsSuppressed,\n      rowsChanged: r.reduce((a, x) => a + ch(x), 0),'
          metric_replacement = '      derivedMetadataRowsSuppressed,\n      freshnessOnlyCanonicalRowsSuppressed,\n      rowsChanged: r.reduce((a, x) => a + ch(x), 0),'
          if text.count(metric_anchor) != 1:
              raise SystemExit(f'metric anchor count={text.count(metric_anchor)}')
          text = text.replace(metric_anchor, metric_replacement, 1)
          p.write_text(text)

          t = Path('tests/gomo-core-derived-metadata-diagnostic.test.mjs')
          test_text = t.read_text()
          addition = r'''

          function freshnessFixture({ provenance = "lastintel", lastWarRankObservedAt = "2026-09-03T00:00:00.000Z" } = {}) {
            const report = fixture({ provenance, flags: ["power_conflict", "hero_power_conflict"] });
            for (const member of report.members) {
              member.sources.lastRank.power += 1_000;
              member.sources.lastRank.heroPower += 100;
              member.sources.lastWarRank.power += 2_000;
              member.sources.lastWarRank.heroPower += 200;
              member.sources.lastWarRank.observedAt = lastWarRankObservedAt;
              if (provenance === "lastwarrank") {
                member.canonical.power = member.sources.lastWarRank.power;
                member.canonical.heroPower = member.sources.lastWarRank.heroPower;
              }
            }
            return report;
          }

          test("un basculement de fraicheur observedAt seul ne change plus la puissance canonique", async (t) => {
            const db = new LocalD1();
            t.after(() => db.close());

            const baseline = freshnessFixture({ provenance: "lastintel", lastWarRankObservedAt: "2026-09-03T00:00:00.000Z" });
            await persist(db, baseline);
            await persist(db, baseline);

            const snapshotsBefore = db.scalar("SELECT COUNT(*) FROM core_canonical_snapshots");
            const observationsBefore = db.scalar("SELECT COUNT(*) FROM core_source_observations");
            const flipped = freshnessFixture({ provenance: "lastwarrank", lastWarRankObservedAt: "2026-09-03T00:30:00.000Z" });
            const result = await persist(db, flipped);

            assert.equal(result.changed, false);
            assert.equal(result.storage.freshnessOnlyCanonicalRowsSuppressed, 94);
            assert.equal(result.storage.changesByStatement.canonical_snapshots_inserted, 0);
            assert.equal(result.storage.changesByStatement.current_members_updated, 0);
            assert.equal(result.storage.changesByStatement.source_observations_inserted, 0);
            assert.equal(result.storage.changesByStatement.current_source_state_updated, 0);
            assert.equal(result.storage.meaningfulRows, 0);
            assert.equal(db.scalar("SELECT COUNT(*) FROM core_canonical_snapshots"), snapshotsBefore);
            assert.equal(db.scalar("SELECT COUNT(*) FROM core_source_observations"), observationsBefore);
          });

          test("une vraie variation de puissance source reste historisee malgre la stabilisation de fraicheur", async (t) => {
            const db = new LocalD1();
            t.after(() => db.close());

            const baseline = freshnessFixture({ provenance: "lastintel", lastWarRankObservedAt: "2026-09-03T00:00:00.000Z" });
            await persist(db, baseline);
            await persist(db, baseline);

            const changedReport = freshnessFixture({ provenance: "lastwarrank", lastWarRankObservedAt: "2026-09-03T00:30:00.000Z" });
            changedReport.members[0].sources.lastWarRank.power += 1;
            changedReport.members[0].canonical.power = changedReport.members[0].sources.lastWarRank.power;

            const result = await persist(db, changedReport);

            assert.equal(result.changed, true);
            assert.equal(result.storage.freshnessOnlyCanonicalRowsSuppressed, 93);
            assert.equal(result.storage.changesByStatement.canonical_snapshots_inserted, 1);
            assert.equal(result.storage.changesByStatement.current_members_updated, 1);
            assert.equal(result.storage.changesByStatement.source_observations_inserted, 1);
            assert.equal(result.storage.changesByStatement.current_source_state_updated, 1);
          });
          '''
          marker = 'un basculement de fraicheur observedAt seul ne change plus la puissance canonique'
          if marker in test_text:
              raise SystemExit('freshness tests already present')
          t.write_text(test_text + addition)
          PY

          git diff --check
          test "$(git diff --name-only | sort)" = $'gomo-core-v06-storage.js\ntests/gomo-core-derived-metadata-diagnostic.test.mjs'

      - name: Run local tests only
        run: npm test

      - name: Commit patch to test branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gomo-core-v06-storage.js tests/gomo-core-derived-metadata-diagnostic.test.mjs
          git commit -m "perf(core): suppress freshness-only canonical churn"
          git push origin HEAD:test/core-d1-read-optimization
