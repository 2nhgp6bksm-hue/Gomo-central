name: One-shot Core test v0.8 first Cron audit

on:
  push:
    branches:
      - test/core-d1-read-optimization
    paths:
      - .github/workflows/core-test-v08-cron-audit-once.yml

permissions:
  contents: read

env:
  WORKER: gomo-core-test
  TARGET_VERSION: b864e993-c8ac-4613-a41e-d3386d835847
  DB_ID: ac1b5094-c1f9-4706-b29b-8507e6f85a92
  EXPECTED_CRON: '15 * * * *'
  EXPECTED_MEMBERS: '94'
  ACTIVATED_AT: '2026-09-03T07:19:27Z'
  FIRST_CRON_WINDOW_START: '2026-09-03T08:14:00Z'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CFPREVIEW }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PREVIEW || secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/core-d1-read-optimization
          fetch-depth: 0
          persist-credentials: false

      - name: Read Cloudflare state and first natural Cron
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            accounts="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts?per_page=50")"
            CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$accounts" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.success||j.result?.length!==1)process.exit(1);process.stdout.write(j.result[0].id)})')"
          fi
          export CLOUDFLARE_ACCOUNT_ID
          mkdir -p cron-audit
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER"
          d1="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$DB_ID/query"
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/deployments" > cron-audit/deployments.json
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/schedules" > cron-audit/schedules.json
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" > cron-audit/subdomain.json
          sql="SELECT sync_id,started_at,completed_at,status,error_json FROM core_sync_runs WHERE started_at >= '$FIRST_CRON_WINDOW_START' ORDER BY started_at ASC LIMIT 1;"
          payload="$(SQL="$sql" node -e 'process.stdout.write(JSON.stringify({sql:process.env.SQL,params:[]}))')"
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data "$payload" "$d1" > cron-audit/first-cron.json
          sql="SELECT (SELECT COUNT(*) FROM core_current_members WHERE active=1 AND membership_status<>'departed') public_members,(SELECT COUNT(*) FROM core_current_source_state) source_rows,(SELECT COUNT(*) FROM core_canonical_snapshots) canonical_now,(SELECT COUNT(*) FROM core_source_observations) observations_now,(SELECT COUNT(*) FROM core_sync_runs) sync_runs_now,(SELECT COUNT(*) FROM core_canonical_snapshots c JOIN core_sync_runs r ON r.sync_id=c.sync_id WHERE r.started_at >= '$ACTIVATED_AT') canonical_delta,(SELECT COUNT(*) FROM core_source_observations o JOIN core_sync_runs r ON r.sync_id=o.sync_id WHERE r.started_at >= '$ACTIVATED_AT') observations_delta;"
          payload="$(SQL="$sql" node -e 'process.stdout.write(JSON.stringify({sql:process.env.SQL,params:[]}))')"
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data "$payload" "$d1" > cron-audit/d1-state.json
          origin="$(node -e "const j=require('./cron-audit/subdomain.json');if(!j.success||!j.result?.subdomain)process.exit(1);process.stdout.write('https://'+process.env.WORKER+'.'+j.result.subdomain+'.workers.dev')")"
          for p in status members power; do curl --max-time 30 -sS -o "cron-audit/$p.body" -w '%{http_code}' "$origin/api/core/$p" > "cron-audit/$p.code"; done
          node - <<'NODE'
          const fs=require('fs');
          const rows=j=>(j.result||[]).flatMap(x=>x.results||[]);
          const dep=JSON.parse(fs.readFileSync('cron-audit/deployments.json','utf8'));
          const sch=JSON.parse(fs.readFileSync('cron-audit/schedules.json','utf8'));
          const sync=rows(JSON.parse(fs.readFileSync('cron-audit/first-cron.json','utf8')))[0]||null;
          const state=rows(JSON.parse(fs.readFileSync('cron-audit/d1-state.json','utf8')))[0]||{};
          const deps=dep.result?.deployments||dep.result||[];
          const active=deps?.[0]?.versions?.slice().sort((a,b)=>Number(b.percentage??0)-Number(a.percentage??0))[0]||null;
          const crons=(Array.isArray(sch.result)?sch.result:(sch.result?.schedules||[])).map(x=>x.cron||x);
          const codes={status:Number(fs.readFileSync('cron-audit/status.code','utf8')),members:Number(fs.readFileSync('cron-audit/members.code','utf8')),power:Number(fs.readFileSync('cron-audit/power.code','utf8'))};
          let status={},members={},power={}; try{status=JSON.parse(fs.readFileSync('cron-audit/status.body','utf8'));}catch{} try{members=JSON.parse(fs.readFileSync('cron-audit/members.body','utf8'));}catch{} try{power=JSON.parse(fs.readFileSync('cron-audit/power.body','utf8'));}catch{}
          const canonicalNow=Number(state.canonical_now||0), observationsNow=Number(state.observations_now||0), canonicalDelta=Number(state.canonical_delta||0), observationsDelta=Number(state.observations_delta||0);
          const report={activeVersion:active?.version_id||null,activePercentage:Number(active?.percentage??0),cron:crons[0]||null,firstNaturalCron:sync,publicMembers:Number(state.public_members||0),sourceRows:Number(state.source_rows||0),canonicalBeforeActivation:canonicalNow-canonicalDelta,canonicalNow,canonicalDelta,observationsBeforeActivation:observationsNow-observationsDelta,observationsNow,observationsDelta,endpoints:codes,endpointMembers:members?.memberCount??null,endpointPower:power?.memberCount??null,coreVersion:members?.coreVersion||status?.coreVersion||null};
          report.ok=active?.version_id===process.env.TARGET_VERSION&&Number(active?.percentage??0)>=99.9&&crons.length===1&&crons[0]===process.env.EXPECTED_CRON&&sync?.status==='ok'&&Number(state.public_members)===94&&Number(state.source_rows)>0&&Object.values(codes).every(x=>x===200)&&status?.ok===true&&members?.memberCount===94&&power?.memberCount===94;
          fs.writeFileSync('cron-audit/report.json',JSON.stringify(report,null,2)+'\n'); console.log('CRON_AUDIT='+JSON.stringify(report)); if(!report.ok)process.exit(2);
          NODE

      - name: Publish audit
        if: always()
        run: |
          if [ -f cron-audit/report.json ]; then cat cron-audit/report.json >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gomo-core-v08-first-cron-audit
          path: cron-audit/
          retention-days: 30
