name: One-shot patch v07 confidence wiring

on:
  push:
    branches:
      - test/core-d1-read-optimization
    paths:
      - .github/workflows/patch-v07-confidence-wiring-once.yml

permissions:
  contents: write

jobs:
  patch-once:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch only
        uses: actions/checkout@v4
        with:
          ref: test/core-d1-read-optimization
          fetch-depth: 0

      - name: Replace exactly one persist import
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('gomo-core-entry-v07.js')
          text = p.read_text()
          old = 'import { persist } from "./gomo-core-v06-storage.js";'
          new = 'import { persist } from "./gomo-core-v06-storage-stable-confidence.js";'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one old import, found {text.count(old)}')
          if new in text:
              raise SystemExit('New import already present')
          p.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          test "$(git diff --name-only)" = "gomo-core-entry-v07.js"
          grep -F 'import { persist } from "./gomo-core-v06-storage-stable-confidence.js";' gomo-core-entry-v07.js

      - name: Commit patch to test branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gomo-core-entry-v07.js
          git commit -m "fix(core): route v07 refresh through stable confidence persistence"
          git push origin HEAD:test/core-d1-read-optimization
