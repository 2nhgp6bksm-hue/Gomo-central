name: One-shot Core cache fail-open patch

on:
  push:
    branches:
      - test/core-d1-read-optimization
    paths:
      - .github/workflows/core-cache-fail-open-patch-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/core-d1-read-optimization
          fetch-depth: 0

      - name: Apply local cache patch
        run: python validation/core-cache-fail-open-patch.py

      - name: Validate patched Core
        run: |
          set -euo pipefail
          node --check gomo-core-entry-v07.js
          node --check gomo-core-entry-v071.js
          npm test
          git diff --check

      - name: Commit cache fix to test branch
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain | grep -v '^ M gomo-core-entry-v07.js$' | grep -v '^ M tests/gomo-core-v07-integration.test.js$' || true)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gomo-core-entry-v07.js tests/gomo-core-v07-integration.test.js
          git commit -m "fix(core): make public cache fail-open"
          git push origin HEAD:test/core-d1-read-optimization
