name: One-shot derived metadata dedup patch v2

on:
  push:
    branches:
      - test/core-d1-read-optimization
    paths:
      - .github/workflows/patch-derived-metadata-dedup-once-v2.yml

permissions:
  contents: write

jobs:
  patch-once:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch only
        uses: actions/checkout@v4
        with:
          ref: test/core-d1-read-optimization
          fetch-depth: 0

      - name: Apply derived metadata dedup correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('gomo-core-v06-storage.js')
          text = p.read_text()

          old_fn = '''function canonicalChanged(current, row) {
            if (!current) return true;
            return !same(current.name, row.name)
              || !same(current.rank, row.rank)
              || !same(current.hq, row.hq)
              || !same(current.power, row.power)
              || !same(current.hero_power, row.hero)
              || !same(current.kills, row.kills)
              || !same(current.avatar_url, row.avatar)
              || !same(current.confidence, row.confidence)
              || !same(current.confidence_level, row.level)
              || !same(current.flags_json, row.flags)
              || !same(current.field_sources_json, row.fields);
          }
          '''
          new_fn = '''function canonicalBusinessChanged(current, row) {
            if (!current) return true;
            return !same(current.name, row.name)
              || !same(current.rank, row.rank)
              || !same(current.hq, row.hq)
              || !same(current.power, row.power)
              || !same(current.hero_power, row.hero)
              || !same(current.kills, row.kills)
              || !same(current.avatar_url, row.avatar);
          }

          function canonicalDerivedChanged(current, row) {
            if (!current) return true;
            return !same(current.confidence, row.confidence)
              || !same(current.confidence_level, row.level)
              || !same(current.flags_json, row.flags)
              || !same(current.field_sources_json, row.fields);
          }
          '''
          if text.count(old_fn) != 1:
              raise SystemExit(f'canonicalChanged block count={text.count(old_fn)}')
          text = text.replace(old_fn, new_fn, 1)

          old_block = '''    const canonicalChanges = p.canonical.filter((row) => canonicalChanged(state.currentMembers.get(row.g), row));
              const currentMemberUpdates = p.canonical.filter((row) => {
                const current = state.currentMembers.get(row.g);
                const membership = nextMembership(state.members.get(row.g), true);
                return canonicalChanged(current, row)
                  || current?.max_hq == null
                  || (row.hq != null && Number(row.hq) > Number(current?.max_hq))
                  || Number(current?.active) !== 1
                  || !same(current?.membership_status, membership);
              });
              const sourceLinkUpdates = p.obs.filter((row) => !same(state.links.get(`${row.s}:${row.id}`), row.g));
              const sourceChanges = p.obs.filter((row) => sourceChanged(state.currentSources.get(`${row.s}:${row.id}`), row));
          '''
          new_block = '''    const sourceLinkUpdates = p.obs.filter((row) => !same(state.links.get(`${row.s}:${row.id}`), row.g));
              const sourceChanges = p.obs.filter((row) => sourceChanged(state.currentSources.get(`${row.s}:${row.id}`), row));
              const sourceChangedMembers = new Set(sourceChanges.map((row) => row.g));
              const canonicalChanges = p.canonical.filter((row) => canonicalBusinessChanged(state.currentMembers.get(row.g), row));
              const derivedMetadataRowsSuppressed = p.canonical.filter((row) => {
                const current = state.currentMembers.get(row.g);
                return current
                  && !canonicalBusinessChanged(current, row)
                  && canonicalDerivedChanged(current, row)
                  && !sourceChangedMembers.has(row.g);
              }).length;
              const currentMemberUpdates = p.canonical.filter((row) => {
                const current = state.currentMembers.get(row.g);
                const membership = nextMembership(state.members.get(row.g), true);
                return canonicalBusinessChanged(current, row)
                  || (canonicalDerivedChanged(current, row) && sourceChangedMembers.has(row.g))
                  || current?.max_hq == null
                  || (row.hq != null && Number(row.hq) > Number(current?.max_hq))
                  || Number(current?.active) !== 1
                  || !same(current?.membership_status, membership);
              });
          '''
          if text.count(old_block) != 1:
              raise SystemExit(f'persist comparison block count={text.count(old_block)}')
          text = text.replace(old_block, new_block, 1)

          metric_anchor = '      dedupStateRowsLoaded: state.rowsLoaded,\n      rowsChanged: r.reduce((a, x) => a + ch(x), 0),'
          metric_replacement = '      dedupStateRowsLoaded: state.rowsLoaded,\n      derivedMetadataRowsSuppressed,\n      rowsChanged: r.reduce((a, x) => a + ch(x), 0),'
          if text.count(metric_anchor) != 1:
              raise SystemExit(f'metrics anchor count={text.count(metric_anchor)}')
          text = text.replace(metric_anchor, metric_replacement, 1)
          p.write_text(text)

          t = Path('tests/gomo-core-derived-metadata-diagnostic.test.mjs')
          test_text = t.read_text()
          old_title1 = 'test("diagnostic: fieldSources seul reproduit des snapshots canoniques sans observation source",'
          old_title2 = 'test("diagnostic: flags seul reproduit aussi un changement canonique sans observation source",'
          if test_text.count(old_title1) != 1 or test_text.count(old_title2) != 1:
              raise SystemExit('diagnostic test titles not found exactly once')
          test_text = test_text.replace(old_title1, 'test("fieldSources seul ne cree plus de snapshot ni de mise a jour courante",', 1)

          old_assert1 = '''  assert.equal(result.changed, true);\n  assert.equal(result.storage.changesByStatement.canonical_snapshots_inserted, 94);\n  assert.equal(result.storage.changesByStatement.current_members_updated, 94);\n  assert.equal(result.storage.changesByStatement.source_observations_inserted, 0);\n  assert.equal(result.storage.changesByStatement.current_source_state_updated, 0);\n  assert.equal(result.storage.meaningfulRows, 188);\n  assert.equal(db.scalar("SELECT COUNT(*) FROM core_canonical_snapshots"), snapshotsBefore + 94);\n  assert.equal(db.scalar("SELECT COUNT(*) FROM core_source_observations"), observationsBefore);'''
          new_assert1 = '''  assert.equal(result.changed, false);\n  assert.equal(result.storage.derivedMetadataRowsSuppressed, 94);\n  assert.equal(result.storage.changesByStatement.canonical_snapshots_inserted, 0);\n  assert.equal(result.storage.changesByStatement.current_members_updated, 0);\n  assert.equal(result.storage.changesByStatement.source_observations_inserted, 0);\n  assert.equal(result.storage.changesByStatement.current_source_state_updated, 0);\n  assert.equal(result.storage.meaningfulRows, 0);\n  assert.equal(db.scalar("SELECT COUNT(*) FROM core_canonical_snapshots"), snapshotsBefore);\n  assert.equal(db.scalar("SELECT COUNT(*) FROM core_source_observations"), observationsBefore);'''
          if test_text.count(old_assert1) != 1:
              raise SystemExit(f'fieldSources assertions count={test_text.count(old_assert1)}')
          test_text = test_text.replace(old_assert1, new_assert1, 1)

          test_text = test_text.replace(old_title2, 'test("flags seuls ne creent plus de snapshot ni de mise a jour courante",', 1)
          old_assert2 = '''  assert.equal(result.changed, true);\n  assert.equal(result.storage.changesByStatement.canonical_snapshots_inserted, 94);\n  assert.equal(result.storage.changesByStatement.current_members_updated, 94);\n  assert.equal(result.storage.changesByStatement.source_observations_inserted, 0);\n  assert.equal(result.storage.changesByStatement.current_source_state_updated, 0);\n  assert.equal(result.storage.meaningfulRows, 188);'''
          new_assert2 = '''  assert.equal(result.changed, false);\n  assert.equal(result.storage.derivedMetadataRowsSuppressed, 94);\n  assert.equal(result.storage.changesByStatement.canonical_snapshots_inserted, 0);\n  assert.equal(result.storage.changesByStatement.current_members_updated, 0);\n  assert.equal(result.storage.changesByStatement.source_observations_inserted, 0);\n  assert.equal(result.storage.changesByStatement.current_source_state_updated, 0);\n  assert.equal(result.storage.meaningfulRows, 0);'''
          if test_text.count(old_assert2) != 1:
              raise SystemExit(f'flags assertions count={test_text.count(old_assert2)}')
          test_text = test_text.replace(old_assert2, new_assert2, 1)

          test_text += '''\n\ntest("une vraie observation source peut actualiser les metadonnees courantes sans creer de snapshot", async (t) => {\n  const db = await seeded();\n  t.after(() => db.close());\n\n  const report = fixture({ provenance: "lastwarrank", flags: ["power_conflict"] });\n  report.members[0].sources.lastRank.power += 1;\n\n  const result = await persist(db, report);\n\n  assert.equal(result.changed, true);\n  assert.equal(result.storage.derivedMetadataRowsSuppressed, 93);\n  assert.equal(result.storage.changesByStatement.canonical_snapshots_inserted, 0);\n  assert.equal(result.storage.changesByStatement.current_members_updated, 1);\n  assert.equal(result.storage.changesByStatement.source_observations_inserted, 1);\n  assert.equal(result.storage.changesByStatement.current_source_state_updated, 1);\n  assert.equal(result.storage.meaningfulRows, 3);\n});\n'''
          t.write_text(test_text)
          PY

          git diff --check
          test "$(git diff --name-only | sort)" = $'gomo-core-v06-storage.js\ntests/gomo-core-derived-metadata-diagnostic.test.mjs'

      - name: Run local tests only
        run: npm test

      - name: Commit patch to test branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gomo-core-v06-storage.js tests/gomo-core-derived-metadata-diagnostic.test.mjs
          git commit -m "perf(core): ignore derived-only canonical churn"
          git push origin HEAD:test/core-d1-read-optimization
