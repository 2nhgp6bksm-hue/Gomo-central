name: One-shot derived-metadata-stable D1 refresh validation
# Autorisation explicite du 3 septembre 2026. Une seule mesure distante de da712c13. Ne pas relancer.

on:
  push:
    branches:
      - test/core-d1-read-optimization
    paths:
      - .github/workflows/cloudflare-d1-stabilized-validation.yml

permissions:
  contents: read

concurrency:
  group: gomo-core-derived-metadata-stable-d1-validation-da712c13
  cancel-in-progress: false

env:
  TESTED_COMMIT: da712c1382f010d46700f706555975e493b12cb8
  VALIDATION_WORKER_NAME: gomo-core-d1-read-validation-28d4ef7
  VALIDATION_DATABASE_NAME: gomo-core-d1-write-validation-105d61d-a3-db
  VALIDATION_DATABASE_ID: bfb37928-febc-4ae6-8075-da89cc40d4d5
  PRODUCTION_DATABASE_ID: ac1b5094-c1f9-4706-b29b-8507e6f85a92
  WRANGLER_CONFIG: validation/derived-metadata-stable-wrangler.generated.json
  RESULTS: validation-results-derived-metadata-stable

jobs:
  measure-once:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CFPREVIEW }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PREVIEW || secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout isolated validation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Lock exact application and safety boundaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$TESTED_COMMIT")" = "$TESTED_COMMIT"
          unexpected="$(git diff --name-only "$TESTED_COMMIT"..HEAD | grep -Ev '^(\.github/workflows/cloudflare-d1-stabilized-validation\.yml$)' || true)"
          test -z "$unexpected"
          test "$VALIDATION_WORKER_NAME" != "gomo-core-test"
          test "$VALIDATION_WORKER_NAME" != "gomo-central"
          test "$VALIDATION_DATABASE_NAME" != "gomo-core-db"
          test "$VALIDATION_DATABASE_ID" != "$PRODUCTION_DATABASE_ID"

      - name: Local harness checks only
        run: |
          set -euo pipefail
          npm test
          node --test validation/final-meter.test.mjs
          node --check validation/final-cloudflare-entry.js

      - name: Prepare isolated binding and one stable masked key
        id: setup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RESULTS"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            accounts="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts?per_page=50")"
            account_id="$(printf '%s' "$accounts" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.success||j.result?.length!==1)process.exit(1);process.stdout.write(j.result[0].id)})')"
            echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"
          fi
          npx --yes wrangler@4.125.0 d1 list --json > "$RESULTS/d1-list.json"
          node -e 'const f=require("fs");const a=JSON.parse(f.readFileSync(process.argv[1]));const d=a.filter(x=>x.name===process.env.VALIDATION_DATABASE_NAME);if(d.length!==1)throw Error(`Expected one isolated D1, got ${d.length}`);const id=d[0].uuid||d[0].id;if(id!==process.env.VALIDATION_DATABASE_ID||id===process.env.PRODUCTION_DATABASE_ID)throw Error(`Unsafe D1 ${id}`)' "$RESULTS/d1-list.json"
          admin_key="$(openssl rand -hex 32)"
          echo "::add-mask::$admin_key"
          node validation/read-write-config.mjs "$VALIDATION_DATABASE_ID" "$admin_key" "$WRANGLER_CONFIG"
          node -e 'const f=require("fs");const p=process.argv[1];const c=JSON.parse(f.readFileSync(p));c.main="final-cloudflare-entry.js";if(c.triggers)throw Error("Cron forbidden");if(c.d1_databases[0].database_id===process.env.PRODUCTION_DATABASE_ID)throw Error("Production D1 forbidden");f.writeFileSync(p,JSON.stringify(c,null,2)+"\n")' "$WRANGLER_CONFIG"
          echo "admin_key=$admin_key" >> "$GITHUB_OUTPUT"

      - name: Redeploy exact corrected application to same isolated Worker
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.125.0 deploy --config "$WRANGLER_CONFIG" | tee "$RESULTS/deploy.txt"

      - name: Wait for edge propagation
        run: sleep 30

      - name: Resolve isolated Worker URL
        id: origin
        shell: bash
        run: |
          set -euo pipefail
          subdomain="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.success||!j.result?.subdomain)process.exit(1);process.stdout.write(j.result.subdomain)})')"
          origin="https://${VALIDATION_WORKER_NAME}.${subdomain}.workers.dev"
          echo "origin=$origin" >> "$GITHUB_OUTPUT"
          echo "$origin" > "$RESULTS/worker-origin.txt"

      - name: Run derived-metadata-stable refresh exactly once
        env:
          ORIGIN: ${{ steps.origin.outputs.origin }}
          ADMIN_KEY: ${{ steps.setup.outputs.admin_key }}
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 0 -sS -D "$RESULTS/sync.headers" -o "$RESULTS/sync.json" -w '%{http_code} %{time_total}\n' -X POST -H "Authorization: Bearer $ADMIN_KEY" "$ORIGIN/api/core/refresh" > "$RESULTS/sync.curl-meta"
          test "$(cut -d' ' -f1 "$RESULTS/sync.curl-meta")" = "200"
          node - <<'NODE'
          const fs = require('fs');
          const resultDir = process.env.RESULTS;
          const body = JSON.parse(fs.readFileSync(`${resultDir}/sync.json`, 'utf8'));
          const rawHeaders = fs.readFileSync(`${resultDir}/sync.headers`, 'utf8');
          const headers = {};
          for (const line of rawHeaders.split(/\r?\n/)) {
            const i = line.indexOf(':');
            if (i > 0) headers[line.slice(0, i).trim().toLowerCase()] = line.slice(i + 1).trim();
          }
          const curlMeta = fs.readFileSync(`${resultDir}/sync.curl-meta`, 'utf8').trim().split(/\s+/);
          const storage = body.storage || {};
          const report = {
            testedCommit: process.env.TESTED_COMMIT,
            worker: process.env.VALIDATION_WORKER_NAME,
            database: process.env.VALIDATION_DATABASE_NAME,
            httpStatus: Number(curlMeta[0]),
            requestSeconds: Number(curlMeta[1]),
            ok: body.ok === true,
            changed: body.changed,
            members: body.members ?? null,
            rowsRead: Number(headers['x-validation-d1-rows-read'] || 0),
            rowsWritten: Number(headers['x-validation-d1-rows-written'] || 0),
            queryCount: Number(headers['x-validation-d1-query-count'] || 0),
            d1DurationMs: Number(headers['x-validation-d1-duration-ms'] || 0),
            tables: String(headers['x-validation-d1-tables'] || '').split(',').filter(Boolean),
            meaningfulRows: storage.meaningfulRows ?? null,
            statements: storage.statements ?? null,
            statementsSkippedAsUnchanged: storage.statementsSkippedAsUnchanged ?? null,
            dedupStateRowsLoaded: storage.dedupStateRowsLoaded ?? null,
            derivedMetadataRowsSuppressed: storage.derivedMetadataRowsSuppressed ?? null,
            volatileConfidenceRowsSuppressed: storage.volatileConfidenceRowsSuppressed ?? null,
            confidenceStabilityRowsLoaded: storage.confidenceStabilityRowsLoaded ?? null,
            changesByStatement: storage.changesByStatement ?? null,
            migrationReplayed: false,
            backfillReplayed: false,
            historicalRecount: false,
            membersPowerEndpointsCalled: false,
            cronConfigured: false,
            mainTouched: false,
            productionTouched: false,
            productionD1Touched: false
          };
          fs.writeFileSync(`${resultDir}/derived-metadata-stable-report.json`, JSON.stringify(report, null, 2) + '\n');
          console.log(JSON.stringify(report));
          if (!report.ok || report.changed !== false) {
            throw new Error(`STOP: changed:false not obtained: ${JSON.stringify({ok: report.ok, changed: report.changed})}`);
          }
          NODE

      - name: Publish derived-metadata-stable measurement
        if: always()
        shell: bash
        run: |
          echo "## Derived-metadata-stable isolated D1 refresh measurement" >> "$GITHUB_STEP_SUMMARY"
          echo "- Migration replayed: \`false\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Backfill replayed: \`false\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Historical recount: \`false\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Members/Power endpoints called: \`false\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cron configured: \`false\`" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RESULTS/derived-metadata-stable-report.json" ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$RESULTS/derived-metadata-stable-report.json" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload one-shot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gomo-core-d1-derived-metadata-stable-evidence
          path: validation-results-derived-metadata-stable/
          if-no-files-found: warn
          retention-days: 30
