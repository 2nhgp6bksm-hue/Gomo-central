name: One-shot isolated D1 read validation
# Validation distante unique autorisee le 3 septembre 2026.

on:
  push:
    branches:
      - test/core-d1-read-optimization
    paths:
      - .github/workflows/cloudflare-d1-read-validation.yml
      - validation/read-cloudflare-entry.js
      - validation/read-write-config.mjs
      - validation/read-validate.mjs

permissions:
  contents: read

concurrency:
  group: gomo-core-d1-read-validation-28d4ef7
  cancel-in-progress: false

env:
  TESTED_COMMIT: 28d4ef7ee214ffd806d723b5f5369d9147168b48
  VALIDATION_WORKER_NAME: gomo-core-d1-read-validation-28d4ef7
  VALIDATION_DATABASE_NAME: gomo-core-d1-write-validation-105d61d-a3-db
  VALIDATION_DATABASE_ID: bfb37928-febc-4ae6-8075-da89cc40d4d5
  PRODUCTION_DATABASE_ID: ac1b5094-c1f9-4706-b29b-8507e6f85a92
  WRANGLER_CONFIG: validation/read-wrangler.generated.json
  RESULTS: validation-results-read

jobs:
  validate-once:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CFPREVIEW }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PREVIEW || secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Lock application commit and production exclusions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$TESTED_COMMIT")" = "$TESTED_COMMIT"
          unexpected="$(git diff --name-only "$TESTED_COMMIT"..HEAD | grep -Ev '^(validation/read-|\.github/workflows/cloudflare-d1-read-validation\.yml$)' || true)"
          test -z "$unexpected"
          test "$VALIDATION_WORKER_NAME" != "gomo-core-test"
          test "$VALIDATION_WORKER_NAME" != "gomo-central"
          test "$VALIDATION_DATABASE_NAME" != "gomo-core-db"
          test "$VALIDATION_DATABASE_ID" != "$PRODUCTION_DATABASE_ID"
          grep -q 'const V = "0.8.0-read-optimization-test"' gomo-core-entry-v07.js

      - name: Local checks only
        run: |
          npm test
          node --test validation/read-meter.test.mjs
          node --check validation/read-cloudflare-entry.js
          node --check validation/read-write-config.mjs
          node --check validation/read-validate.mjs

      - name: Resolve Cloudflare account and verify isolated D1
        id: d1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RESULTS"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            accounts="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts?per_page=50")"
            account_id="$(printf '%s' "$accounts" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.success||j.result?.length!==1)process.exit(1);process.stdout.write(j.result[0].id)})')"
            echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"
          fi
          npx --yes wrangler@4.125.0 d1 list --json > "$RESULTS/d1-list.json"
          node -e 'const f=require("fs");const a=JSON.parse(f.readFileSync(process.argv[1]));const d=a.filter(x=>x.name===process.env.VALIDATION_DATABASE_NAME);if(d.length!==1)throw Error(`Expected one isolated D1, got ${d.length}`);const id=d[0].uuid||d[0].id;if(id!==process.env.VALIDATION_DATABASE_ID||id===process.env.PRODUCTION_DATABASE_ID)throw Error(`Unsafe D1 ${id}`)' "$RESULTS/d1-list.json"
          admin_key="$(openssl rand -hex 32)"
          node validation/read-write-config.mjs "$VALIDATION_DATABASE_ID" "$admin_key" "$WRANGLER_CONFIG"
          node -e 'const c=require("./validation/read-wrangler.generated.json");if(c.triggers)throw Error("Cron/triggers forbidden");if(c.d1_databases[0].database_id===process.env.PRODUCTION_DATABASE_ID)throw Error("Production D1 forbidden")'
          echo "admin_key=$admin_key" >> "$GITHUB_OUTPUT"

      - name: Record isolated history baseline
        shell: bash
        run: |
          set -euo pipefail
          sql="SELECT (SELECT COUNT(*) FROM core_canonical_snapshots) canonical_snapshots,(SELECT COUNT(*) FROM core_source_observations) source_observations;"
          npx --yes wrangler@4.125.0 d1 execute "$VALIDATION_DATABASE_NAME" --remote --command "$sql" --json --config "$WRANGLER_CONFIG" > "$RESULTS/history-before.json"

      - name: Apply current-state migration and isolated backfill once
        run: |
          npx --yes wrangler@4.125.0 d1 execute "$VALIDATION_DATABASE_NAME" --remote --file migrations/0003_gomo_core_current_state.sql --config "$WRANGLER_CONFIG"
          npx --yes wrangler@4.125.0 d1 execute "$VALIDATION_DATABASE_NAME" --remote --file validation/backfill-current-state.sql --config "$WRANGLER_CONFIG"

      - name: Deploy isolated Worker without Cron
        run: npx --yes wrangler@4.125.0 deploy --config "$WRANGLER_CONFIG"

      - name: Resolve isolated Worker URL
        id: origin
        shell: bash
        run: |
          set -euo pipefail
          subdomain="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.success||!j.result?.subdomain)process.exit(1);process.stdout.write(j.result.subdomain)})')"
          origin="https://${VALIDATION_WORKER_NAME}.${subdomain}.workers.dev"
          echo "origin=$origin" >> "$GITHUB_OUTPUT"
          echo "$origin" > "$RESULTS/worker-origin.txt"

      - name: Run exactly one controlled synchronization
        env:
          ORIGIN: ${{ steps.origin.outputs.origin }}
          ADMIN_KEY: ${{ steps.d1.outputs.admin_key }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -D "$RESULTS/sync.headers" -o "$RESULTS/sync.json" -X POST -H "Authorization: Bearer $ADMIN_KEY" "$ORIGIN/api/core/refresh"
          node -e 'const j=require("./validation-results-read/sync.json");if(!j.ok)throw Error(JSON.stringify(j))'

      - name: Call Members exactly once
        env:
          ORIGIN: ${{ steps.origin.outputs.origin }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -D "$RESULTS/members.headers" -o "$RESULTS/members.json" "$ORIGIN/api/core/members"
          node -e 'const j=require("./validation-results-read/members.json");if(!j.ok||j.memberCount!==94)throw Error(JSON.stringify({ok:j.ok,memberCount:j.memberCount}))'

      - name: Call Power exactly once
        env:
          ORIGIN: ${{ steps.origin.outputs.origin }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -D "$RESULTS/power.headers" -o "$RESULTS/power.json" "$ORIGIN/api/core/power"
          node -e 'const j=require("./validation-results-read/power.json");if(!j.ok||j.memberCount!==94)throw Error(JSON.stringify({ok:j.ok,memberCount:j.memberCount}))'

      - name: Verify current state and preserved history once
        shell: bash
        run: |
          set -euo pipefail
          state_sql="SELECT (SELECT COUNT(*) FROM core_current_members WHERE active=1 AND membership_status<>'departed') current_active,(SELECT COUNT(*) FROM core_current_members WHERE hq IS NULL) missing_hq,(SELECT COUNT(*) FROM core_current_members WHERE power IS NULL) missing_power,(SELECT COUNT(*) FROM core_current_members WHERE rank IS NULL OR trim(rank)='') missing_rank,(SELECT COUNT(*) FROM core_current_members WHERE observed_at IS NULL OR trim(observed_at)='') missing_observation,(SELECT COUNT(*) FROM core_current_source_state WHERE observed_at IS NOT NULL) useful_source_rows,(SELECT COUNT(*) FROM core_sync_runs WHERE status='ok') successful_syncs,(SELECT COUNT(*) FROM core_canonical_snapshots) canonical_snapshots,(SELECT COUNT(*) FROM core_source_observations) source_observations;"
          npx --yes wrangler@4.125.0 d1 execute "$VALIDATION_DATABASE_NAME" --remote --command "$state_sql" --json --config "$WRANGLER_CONFIG" > "$RESULTS/state-after.json"
          history_sql="SELECT (SELECT COUNT(*) FROM core_canonical_snapshots WHERE gomo_id=(SELECT gomo_id FROM core_current_members WHERE active=1 LIMIT 1)) canonical_sample_rows,(SELECT COUNT(*) FROM core_source_observations WHERE gomo_id=(SELECT gomo_id FROM core_current_members WHERE active=1 LIMIT 1)) source_sample_rows;"
          npx --yes wrangler@4.125.0 d1 execute "$VALIDATION_DATABASE_NAME" --remote --command "$history_sql" --json --config "$WRANGLER_CONFIG" > "$RESULTS/history-sample.json"

      - name: Build final read report
        run: node validation/read-validate.mjs "$RESULTS"

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          echo "## One-shot isolated D1 read validation" >> "$GITHUB_STEP_SUMMARY"
          echo "- Worker: \`$VALIDATION_WORKER_NAME\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- D1: \`$VALIDATION_DATABASE_NAME\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Application commit: \`$TESTED_COMMIT\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cron configured: \`false\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production D1 targeted: \`false\`" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RESULTS/validation-report.json" ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$RESULTS/validation-report.json" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gomo-core-d1-read-validation-evidence
          path: validation-results-read/
          if-no-files-found: warn
          retention-days: 30
