name: Core production membership focused SELECT-only
on:
  push:
    branches: [audit/core-v081-production-membership-focus-2026-09-22]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CFPREVIEW }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PREVIEW || secrets.CLOUDFLARE_ACCOUNT_ID }}
      DB: gomo-core-db
    steps:
      - name: Resolve account
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            a="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts?per_page=50")"
            CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$a" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.success||j.result?.length!==1)process.exit(1);process.stdout.write(j.result[0].id)})')"
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID" >> "$GITHUB_ENV"
      - name: Focused identity and membership SELECT only
        run: |
          npx --yes wrangler@4.136.1 d1 execute "$DB" --remote --json --command "SELECT 'NEW' kind,m.gomo_id,m.current_name,m.active,mm.status,mm.confirmation_syncs,mm.missing_syncs,m.created_at,m.updated_at,mm.status_updated_at FROM core_members m LEFT JOIN core_member_membership mm ON mm.gomo_id=m.gomo_id WHERE m.created_at >= '2026-09-22T07:05:00.000Z' UNION ALL SELECT 'MISSING',m.gomo_id,m.current_name,m.active,mm.status,mm.confirmation_syncs,mm.missing_syncs,m.created_at,m.updated_at,mm.status_updated_at FROM core_member_membership mm JOIN core_members m ON m.gomo_id=mm.gomo_id WHERE mm.missing_syncs>0 ORDER BY kind,current_name;"
      - name: New identity links SELECT only
        run: |
          npx --yes wrangler@4.136.1 d1 execute "$DB" --remote --json --command "SELECT sl.source,sl.source_member_id,sl.gomo_id,m.current_name,sl.first_seen,sl.last_seen FROM core_source_links sl JOIN core_members m ON m.gomo_id=sl.gomo_id WHERE sl.first_seen >= '2026-09-22T07:05:00.000Z' ORDER BY m.current_name,sl.source; SELECT a.gomo_id,m.current_name,a.alias,a.source,a.first_seen,a.last_seen FROM core_member_aliases a JOIN core_members m ON m.gomo_id=a.gomo_id WHERE a.first_seen >= '2026-09-22T07:05:00.000Z' ORDER BY m.current_name,a.alias;"
