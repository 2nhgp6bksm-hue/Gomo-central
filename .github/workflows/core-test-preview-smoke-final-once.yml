name: One-shot Core test preview final smoke

on:
  push:
    branches:
      - test/core-d1-read-optimization
    paths:
      - .github/workflows/core-test-preview-smoke-final-once.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CFPREVIEW }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PREVIEW || secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER: gomo-core-test
      PREVIEW_URL: https://cache-fail-open-gomo-core-test.gjp86wh7p2.workers.dev
    steps:
      - name: Verify preview status members power GET-only
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          for path in status members power; do
            code="$(curl --silent --show-error --retry 0 --max-time 30 -D "$path.headers" -o "$path.json" -w '%{http_code}' "$PREVIEW_URL/api/core/$path")"
            test "$code" = "200"
          done
          node - <<'NODE'
          const fs=require('fs');
          const status=JSON.parse(fs.readFileSync('status.json'));
          const members=JSON.parse(fs.readFileSync('members.json'));
          const power=JSON.parse(fs.readFileSync('power.json'));
          if(status.ok!==true) throw new Error('status not ok');
          if(members.memberCount!==94 || members.members?.length!==94) throw new Error(`members ${members.memberCount}`);
          if(power.memberCount!==94 || power.members?.length!==94) throw new Error(`power ${power.memberCount}`);
          if(status.coreVersion!=='0.8.0-read-optimization-test' || members.coreVersion!=='0.8.0-read-optimization-test' || power.coreVersion!=='0.8.0-read-optimization-test') throw new Error('wrong Core version');
          const cache=(f)=>fs.readFileSync(f,'utf8').match(/x-gomo-core-cache:\s*(\S+)/i)?.[1]||null;
          console.log('FINAL_PREVIEW_SMOKE='+JSON.stringify({status:200,members:members.memberCount,power:power.memberCount,coreVersion:members.coreVersion,statusCache:cache('status.headers'),membersCache:cache('members.headers'),powerCache:cache('power.headers')}));
          NODE

      - name: Confirm active deployment and Cron still unchanged read-only
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            accounts="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts?per_page=50")"
            CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$accounts" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.success||j.result?.length!==1)process.exit(1);process.stdout.write(j.result[0].id)})')"
          fi
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER"
          deployments="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/deployments")"
          schedules="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/schedules")"
          DEPLOYMENTS="$deployments" SCHEDULES="$schedules" node - <<'NODE'
          const d=JSON.parse(process.env.DEPLOYMENTS), s=JSON.parse(process.env.SCHEDULES);
          if(!d.success||!s.success) process.exit(1);
          const deps=d.result?.deployments||d.result||[];
          const activeVersion=deps?.[0]?.versions?.[0]?.version_id||null;
          if(activeVersion!=='fe297cda-d6fe-460b-b3da-ebbc5983e3ca') throw new Error(`active version changed: ${activeVersion}`);
          const list=Array.isArray(s.result)?s.result:(s.result?.schedules||[]);
          if(list.length!==1||list[0].cron!=='15 * * * *'||list[0].modified_on!=='2026-08-27T19:17:05.825335Z') throw new Error('Cron changed');
          console.log('FINAL_PREVIEW_INVARIANTS='+JSON.stringify({activeVersion,cron:list[0].cron,cronModifiedOn:list[0].modified_on,previewVersionActive:false}));
          NODE
