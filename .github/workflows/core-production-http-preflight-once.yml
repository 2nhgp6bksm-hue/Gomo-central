name: One-shot Core production HTTP preflight read-only

on:
  push:
    branches:
      - test/core-d1-read-optimization
    paths:
      - .github/workflows/core-production-http-preflight-once.yml

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CFPREVIEW }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PREVIEW || secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROD_WORKER: gomo-central
    steps:
      - name: Diagnose production Worker with GET endpoints only
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            accounts="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts?per_page=50")"
            CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$accounts" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.success||j.result?.length!==1)process.exit(1);process.stdout.write(j.result[0].id)})')"
          fi
          export CLOUDFLARE_ACCOUNT_ID
          subdomain="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.success||!j.result?.subdomain)process.exit(1);process.stdout.write(j.result.subdomain)})')"
          origin="https://${PROD_WORKER}.${subdomain}.workers.dev"
          mkdir -p preflight-http
          for path in status members power; do
            code="$(curl --retry 0 -sS -D "preflight-http/${path}.headers" -o "preflight-http/${path}.body" -w '%{http_code}' "$origin/api/core/$path")"
            printf '%s\n' "$code" > "preflight-http/${path}.code"
          done
          ORIGIN="$origin" node - <<'NODE'
          const fs=require('fs');
          const parse=(p)=>{const raw=fs.readFileSync(p,'utf8');try{return {json:JSON.parse(raw),raw:null}}catch{return {json:null,raw:raw.slice(0,500)}}};
          const count=(x)=>Array.isArray(x)?x.length:Array.isArray(x?.members)?x.members.length:Array.isArray(x?.data)?x.data.length:Number(x?.memberCount??x?.membersCount??NaN);
          const endpoints={};
          for(const name of ['status','members','power']){
            const code=Number(fs.readFileSync(`preflight-http/${name}.code`,'utf8').trim());
            const parsed=parse(`preflight-http/${name}.body`);
            const j=parsed.json;
            endpoints[name]={
              code,
              count:name==='status'?null:(j?count(j):null),
              error:j?.error||j?.message||null,
              keys:j&&typeof j==='object'&&!Array.isArray(j)?Object.keys(j).slice(0,20):[],
              nonJsonPreview:parsed.raw
            };
          }
          const report={worker:process.env.PROD_WORKER,origin:process.env.ORIGIN,endpoints,readOnly:true};
          fs.writeFileSync('preflight-http/report.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report));
          NODE

      - name: Publish HTTP diagnostic
        if: always()
        shell: bash
        run: |
          echo '## Core production HTTP diagnostic — GET only' >> "$GITHUB_STEP_SUMMARY"
          if [ -f preflight-http/report.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat preflight-http/report.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
