name: Deploy isolated gomo-core-test on dedicated D1

on:
  push:
    branches:
      - test/core-d1-read-optimization
    paths:
      - .github/workflows/gomo-core-v08-isolation.yml

permissions:
  contents: read

concurrency:
  group: gomo-core-v08-d1-isolation
  cancel-in-progress: false

env:
  TEST_BRANCH: test/core-d1-read-optimization
  TEST_WORKER_NAME: gomo-core-test
  TEST_DATABASE_NAME: gomo-core-v08-read-test-db
  TEST_DATABASE_ID: 45ca2537-70d2-409c-9db1-2fa1772c0a2d
  PRODUCTION_DATABASE_NAME: gomo-core-db
  PRODUCTION_DATABASE_ID: ac1b5094-c1f9-4706-b29b-8507e6f85a92
  WRANGLER_CONFIG: wrangler.jsonc

jobs:
  deploy-isolated-test-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CFPREVIEW }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PREVIEW || secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Safety gate — isolated test only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$TEST_BRANCH"
          node - <<'NODE'
          const fs = require('fs');
          const c = JSON.parse(fs.readFileSync(process.env.WRANGLER_CONFIG, 'utf8'));
          if (c.name !== process.env.TEST_WORKER_NAME) throw new Error(`Unexpected Worker: ${c.name}`);
          if (c.main !== 'gomo-core-entry-v071.js') throw new Error(`Unexpected entry point: ${c.main}`);
          if (c.build) throw new Error('Custom build must stay disabled; tests run separately');
          const d1 = c.d1_databases?.[0];
          if (!d1 || d1.binding !== 'CORE_DB') throw new Error('CORE_DB binding missing');
          if (d1.database_name !== process.env.TEST_DATABASE_NAME || d1.database_id !== process.env.TEST_DATABASE_ID) {
            throw new Error(`Unexpected test D1: ${JSON.stringify(d1)}`);
          }
          if (d1.database_id === process.env.PRODUCTION_DATABASE_ID || d1.database_name === process.env.PRODUCTION_DATABASE_NAME) {
            throw new Error('Production D1 forbidden');
          }
          const crons = c.triggers?.crons || [];
          if (crons.length !== 1 || crons[0] !== '15 * * * *') throw new Error(`Unexpected Cron config: ${JSON.stringify(crons)}`);
          NODE
          grep -q 'const V = "0.8.0-read-optimization-test"' gomo-core-entry-v07.js

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run regression suite before deploy
        shell: bash
        run: |
          set -euo pipefail
          npm test
          node --check gomo-core-entry-v07.js
          node --check gomo-core-entry-v071.js

      - name: Resolve Cloudflare account and verify dedicated D1
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            accounts="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts?per_page=50")"
            account_id="$(printf '%s' "$accounts" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.success||j.result?.length!==1)process.exit(1);process.stdout.write(j.result[0].id)})')"
            test -n "$account_id"
            echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"
          fi
          npx --yes wrangler@4.125.0 d1 list --json > /tmp/d1-list.json
          node - <<'NODE'
          const list = require('/tmp/d1-list.json');
          const m = list.filter(x => x.name === process.env.TEST_DATABASE_NAME);
          if (m.length !== 1) throw new Error(`Expected exactly one dedicated D1, got ${m.length}`);
          const id = m[0].uuid || m[0].id;
          if (id !== process.env.TEST_DATABASE_ID) throw new Error(`Dedicated D1 ID mismatch: ${id}`);
          if (id === process.env.PRODUCTION_DATABASE_ID) throw new Error('Production D1 forbidden');
          NODE

      - name: Deploy isolated gomo-core-test
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.125.0 deploy --config "$WRANGLER_CONFIG"

      - name: Publish isolation result
        if: always()
        shell: bash
        run: |
          {
            echo "## GoMo Core v0.8 isolated test deploy"
            echo
            echo "- Branch: \`$TEST_BRANCH\`"
            echo "- Worker: \`$TEST_WORKER_NAME\`"
            echo "- D1: \`$TEST_DATABASE_NAME\`"
            echo "- D1 ID: \`$TEST_DATABASE_ID\`"
            echo "- Production D1 targeted: \`false\`"
            echo "- Manual refresh executed: \`false\`"
            echo "- Cron kept: \`15 * * * *\`"
          } >> "$GITHUB_STEP_SUMMARY"
