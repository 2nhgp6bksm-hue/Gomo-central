name: Deploy Core v0.8 final candidate to gomo-core-test once

on:
  push:
    branches:
      - deploy/core-v08-final-test-2026-09-20
    paths:
      - .github/workflows/deploy-core-v08-final-once.yml

permissions:
  contents: read

concurrency:
  group: deploy-core-v08-final-test-once
  cancel-in-progress: false

env:
  CANDIDATE_SHA: b02c909a851e7f35deedd13d7980d34d598a6223
  DEPLOY_BRANCH: deploy/core-v08-final-test-2026-09-20
  WORKER_NAME: gomo-core-test
  WORKER_URL: https://gomo-core-test.gjp86wh7p2.workers.dev
  DATABASE_NAME: gomo-core-v08-read-test-db
  DATABASE_ID: 45ca2537-70d2-409c-9db1-2fa1772c0a2d
  ROLLBACK_VERSION: 054617d5-baa6-4dc3-9866-a87f61c19b2e
  ROLLBACK_DEPLOYMENT: 33cf2723-5a6b-434c-a407-dc45ce35d586
  LAST_SYNC_BEFORE_DEPLOY: 2026-09-19T19:15:39.551Z

jobs:
  controlled-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CFPREVIEW }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PREVIEW || secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout exact validated candidate
        uses: actions/checkout@v4
        with:
          ref: b02c909a851e7f35deedd13d7980d34d598a6223
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable candidate and local safety gate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$DEPLOY_BRANCH"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          node validation/core-v08-preparation-guard.mjs
          node - <<'NODE'
          const fs = require('fs');
          const c = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          const d1 = c.d1_databases || [];
          if (c.name !== process.env.WORKER_NAME) throw new Error(`Worker interdit: ${c.name}`);
          if (c.vars?.GOMO_CORE_MODE !== 'test') throw new Error(`Mode interdit: ${c.vars?.GOMO_CORE_MODE}`);
          if ((c.triggers?.crons || []).length !== 0) throw new Error('Un Cron est declare');
          if (d1.length !== 1) throw new Error(`Nombre de bindings D1 inattendu: ${d1.length}`);
          if (d1[0].binding !== 'CORE_DB' || d1[0].database_name !== process.env.DATABASE_NAME || d1[0].database_id !== process.env.DATABASE_ID) {
            throw new Error(`Binding D1 interdit: ${JSON.stringify(d1[0])}`);
          }
          const serialized = JSON.stringify(c);
          if (serialized.includes('gomo-central') || serialized.includes('gomo-core-db')) {
            throw new Error('Reference de production interdite dans wrangler.jsonc');
          }
          NODE

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run 30 tests and Core syntax controls
        shell: bash
        run: |
          set -euo pipefail
          npm test | tee /tmp/core-v08-tests.tap
          node - <<'NODE'
          const s = require('fs').readFileSync('/tmp/core-v08-tests.tap', 'utf8');
          const pass = Number((s.match(/^(?:#|ℹ) pass (\d+)$/m) || [])[1]);
          const fail = Number((s.match(/^(?:#|ℹ) fail (\d+)$/m) || [])[1]);
          if (pass !== 30 || fail !== 0) throw new Error(`Resultat attendu 30/30, obtenu pass=${pass}, fail=${fail}`);
          NODE
          node --check gomo-core-entry-v071.js
          node --check gomo-core-entry-v07.js
          node --check gomo-core-entry-v06.js
          node --check gomo-core-v06-engine.js
          node --check gomo-core-v06-storage-stable-confidence.js
          node --check gomo-core-avatars.js

      - name: Read-only Cloudflare precheck
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          node - <<'NODE'
          const fs = require('fs');
          const token = process.env.CLOUDFLARE_API_TOKEN;
          let account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const headers = {Authorization: `Bearer ${token}`};
          async function api(path) {
            const r = await fetch(`https://api.cloudflare.com/client/v4${path}`, {headers});
            const j = await r.json();
            if (!r.ok || !j.success) throw new Error(`GET ${path} a echoue: HTTP ${r.status}`);
            return j.result;
          }
          function deployments(result) { return Array.isArray(result) ? result : (result?.deployments || result?.items || []); }
          function bindingList(doc) {
            const out = [], seen = new Set();
            function walk(x) {
              if (!x || typeof x !== 'object' || seen.has(x)) return;
              seen.add(x);
              if (typeof x.type === 'string' && typeof x.name === 'string') out.push(x);
              for (const v of Object.values(x)) walk(v);
            }
            walk(doc); return out;
          }
          function assertBindings(version) {
            const bindings = bindingList(version);
            const db = bindings.find(x => x.type === 'd1' && x.name === 'CORE_DB');
            const mode = bindings.find(x => x.type === 'plain_text' && x.name === 'GOMO_CORE_MODE');
            const dbId = db?.id || db?.database_id;
            const modeValue = mode?.text ?? mode?.value;
            if (dbId !== process.env.DATABASE_ID) throw new Error(`CORE_DB actif interdit: ${dbId}`);
            if (modeValue !== 'test') throw new Error(`GOMO_CORE_MODE actif interdit: ${modeValue}`);
          }
          (async () => {
            if (!account) {
              const accounts = await api('/accounts?per_page=50');
              if (!Array.isArray(accounts) || accounts.length !== 1) throw new Error('Compte Cloudflare non resolu sans ambiguite');
              account = accounts[0].id;
            }
            const base = `/accounts/${account}/workers/scripts/${process.env.WORKER_NAME}`;
            const [schedules, depResult, oldVersion, d1Result] = await Promise.all([
              api(`${base}/schedules`),
              api(`${base}/deployments`),
              api(`${base}/versions/${process.env.ROLLBACK_VERSION}`),
              api(`/accounts/${account}/d1/database?per_page=100`),
            ]);
            if ((schedules || []).length !== 0) throw new Error(`Cron actif avant deploiement: ${JSON.stringify(schedules)}`);
            const deps = deployments(depResult);
            const active = deps.find(d => d.id === process.env.ROLLBACK_DEPLOYMENT);
            if (!active) throw new Error('Deployment de rollback attendu introuvable avant deploiement');
            const allocation = active.versions || [];
            if (!allocation.some(v => (v.version_id || v.id) === process.env.ROLLBACK_VERSION && Number(v.percentage) === 100)) {
              throw new Error(`Version/traffic actifs inattendus: ${JSON.stringify(allocation)}`);
            }
            assertBindings(oldVersion);
            const databases = Array.isArray(d1Result) ? d1Result : (d1Result?.items || []);
            const named = databases.filter(x => x.name === process.env.DATABASE_NAME);
            if (named.length !== 1 || (named[0].uuid || named[0].id) !== process.env.DATABASE_ID) throw new Error('D1 test non identifiee exactement');
            fs.writeFileSync('/tmp/cloudflare-account-id', account);
            fs.writeFileSync('/tmp/precheck.json', JSON.stringify({worker: process.env.WORKER_NAME, version: process.env.ROLLBACK_VERSION, deployment: process.env.ROLLBACK_DEPLOYMENT, traffic: '100%', cron: 0, d1: process.env.DATABASE_ID, mode: 'test'}, null, 2));
          })().catch(e => { console.error(e.message); process.exit(1); });
          NODE
          echo "CLOUDFLARE_ACCOUNT_ID=$(cat /tmp/cloudflare-account-id)" >> "$GITHUB_ENV"

      - name: Deploy exact candidate to gomo-core-test
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.125.0 deploy --config wrangler.jsonc | tee /tmp/wrangler-deploy.log

      - name: Read-only post-deployment verification
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const headers = {Authorization: `Bearer ${token}`};
          async function api(path) {
            const r = await fetch(`https://api.cloudflare.com/client/v4${path}`, {headers});
            const j = await r.json();
            if (!r.ok || !j.success) throw new Error(`GET ${path} a echoue: HTTP ${r.status}`);
            return j.result;
          }
          function deployments(result) { return Array.isArray(result) ? result : (result?.deployments || result?.items || []); }
          function bindingList(doc) {
            const out = [], seen = new Set();
            function walk(x) {
              if (!x || typeof x !== 'object' || seen.has(x)) return;
              seen.add(x);
              if (typeof x.type === 'string' && typeof x.name === 'string') out.push(x);
              for (const v of Object.values(x)) walk(v);
            }
            walk(doc); return out;
          }
          async function publicGet(path) {
            const r = await fetch(`${process.env.WORKER_URL}${path}`, {method: 'GET', redirect: 'error'});
            const text = await r.text();
            let body; try { body = JSON.parse(text); } catch { throw new Error(`${path}: reponse non JSON, HTTP ${r.status}`); }
            if (r.status !== 200) throw new Error(`${path}: HTTP ${r.status}`);
            return {status: r.status, body};
          }
          function findTimestamp(x) {
            const candidates = [x?.lastSuccessfulSync?.completedAt, x?.lastSuccessfulSync?.completed_at, x?.lastSyncV06?.completed_at, x?.generatedAt];
            return candidates.find(Boolean) || null;
          }
          (async () => {
            const base = `/accounts/${account}/workers/scripts/${process.env.WORKER_NAME}`;
            const [schedules, depResult, oldVersion, status, members] = await Promise.all([
              api(`${base}/schedules`),
              api(`${base}/deployments`),
              api(`${base}/versions/${process.env.ROLLBACK_VERSION}`),
              publicGet('/api/core/status'),
              publicGet('/api/core/members'),
            ]);
            if ((schedules || []).length !== 0) throw new Error(`Cron actif apres deploiement: ${JSON.stringify(schedules)}`);
            const deps = deployments(depResult).sort((a,b) => Date.parse(b.created_on || b.created_at || 0) - Date.parse(a.created_on || a.created_at || 0));
            const newest = deps.find(d => d.id !== process.env.ROLLBACK_DEPLOYMENT && (d.versions || []).some(v => Number(v.percentage) === 100));
            if (!newest) throw new Error('Nouveau deployment actif a 100% introuvable');
            const activeAllocation = (newest.versions || []).find(v => Number(v.percentage) === 100);
            const versionId = activeAllocation?.version_id || activeAllocation?.id;
            if (!versionId) throw new Error('Nouvelle version active introuvable');
            const version = await api(`${base}/versions/${versionId}`);
            const bindings = bindingList(version);
            const db = bindings.find(x => x.type === 'd1' && x.name === 'CORE_DB');
            const modeBinding = bindings.find(x => x.type === 'plain_text' && x.name === 'GOMO_CORE_MODE');
            const dbId = db?.id || db?.database_id;
            const mode = modeBinding?.text ?? modeBinding?.value;
            if (dbId !== process.env.DATABASE_ID) throw new Error(`CORE_DB apres deploiement interdit: ${dbId}`);
            if (mode !== 'test') throw new Error(`Mode apres deploiement interdit: ${mode}`);
            const count = Number(members.body?.memberCount ?? members.body?.members?.length);
            if (!Number.isFinite(count)) throw new Error('Effectif stocke non lisible');
            const syncTime = findTimestamp(members.body) || findTimestamp(status.body);
            if (syncTime !== process.env.LAST_SYNC_BEFORE_DEPLOY) throw new Error(`La date de synchronisation a change: ${syncTime}`);
            const coreVersion = members.body?.hardeningVersion || status.body?.hardening?.version || status.body?.version || null;
            const report = {
              guard: 'REUSSI', tests: '30/30 reussis', syntaxe: 'REUSSIE', deployment: 'REUSSI',
              worker: process.env.WORKER_NAME, newVersion: versionId, deploymentId: newest.id,
              traffic: '100%', coreVersion, mode, storedMembers: count,
              d1: `${process.env.DATABASE_NAME} (${dbId})`, cron: 'AUCUN',
              rollbackVersionIdentifiable: Boolean(oldVersion), syncTriggered: false,
              productionModified: false, d1IntentionallyModified: false,
              statusHttp: status.status, lastSuccessfulSync: syncTime,
            };
            fs.writeFileSync('/tmp/final-report.json', JSON.stringify(report, null, 2));
            console.log(JSON.stringify(report, null, 2));
          })().catch(e => { console.error(e.message); process.exit(1); });
          NODE

      - name: Publish controlled deployment report
        if: always()
        shell: bash
        run: |
          {
            echo "## Deploiement controle Core v0.8"
            echo
            if [ -f /tmp/final-report.json ]; then
              echo '```json'
              cat /tmp/final-report.json
              echo '```'
            else
              echo "Le deploiement ou un controle a echoue. Consulter l'etape fautive; aucune synchronisation n'a ete demandee."
            fi
            echo
            echo "- Synchronisation demandee: \`NON\`"
            echo "- POST /api/core/refresh: \`NON\`"
            echo "- Migration/backfill: \`NON\`"
          } >> "$GITHUB_STEP_SUMMARY"
