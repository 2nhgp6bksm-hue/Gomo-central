name: One-shot read-only D1 SQL precontrol

on:
  push:
    branches:
      - audit/d1-read-precontrol-2026-09-21
    paths:
      - .github/workflows/d1-read-precontrol-once.yml

permissions:
  contents: read

concurrency:
  group: gomo-core-d1-read-precontrol-once
  cancel-in-progress: false

jobs:
  d1-read-precontrol:
    if: github.event.before == '88e410450439eb8e66dc494bedecc80fd84e31a7'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CFPREVIEW }}
      CLOUDFLARE_ACCOUNT_ID: 8c513559f775c0cca653268ab2f29c0d
      WORKER_NAME: gomo-core-test
      DATABASE_NAME: gomo-core-v08-read-test-db
      DATABASE_ID: 45ca2537-70d2-409c-9db1-2fa1772c0a2d
      EXPECTED_VERSION: 1072896a-eb51-4763-8ac3-b75c3994907c
      EXPECTED_DEPLOYMENT: ceb4ae6d-8120-4dcf-a858-7dff244d84d3

    steps:
      - name: Validate authentication inputs without revealing values
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          echo "Cloudflare token secret: CFPREVIEW"
          echo "Cloudflare account id source: known fixed identifier (not a secret)"

      - name: Read-only pre-state verification
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const worker = process.env.WORKER_NAME;
          const databaseId = process.env.DATABASE_ID;
          const headers = { Authorization: `Bearer ${token}` };

          async function get(path) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              method: "GET",
              headers,
            });
            const body = await response.json();
            if (!response.ok || !body.success) {
              throw new Error(`GET ${path} failed with HTTP ${response.status}`);
            }
            return body.result;
          }

          function deploymentList(value) {
            return Array.isArray(value) ? value : (value?.deployments || value?.items || []);
          }

          function scheduleList(value) {
            return Array.isArray(value) ? value : (value?.schedules || value?.items || []);
          }

          function activeDeployment(value) {
            const deployments = deploymentList(value)
              .slice()
              .sort((a, b) => Date.parse(b.created_on || b.created_at || 0) - Date.parse(a.created_on || a.created_at || 0));
            for (const deployment of deployments) {
              const active = (deployment.versions || []).find((version) => Number(version.percentage) === 100);
              if (active) {
                return {
                  deploymentId: deployment.id,
                  versionId: active.version_id || active.id,
                };
              }
            }
            return { deploymentId: null, versionId: null };
          }

          (async () => {
            const workerBase = `/accounts/${account}/workers/scripts/${worker}`;
            const [deployments, schedules, database] = await Promise.all([
              get(`${workerBase}/deployments`),
              get(`${workerBase}/schedules`),
              get(`/accounts/${account}/d1/database/${databaseId}`),
            ]);
            const active = activeDeployment(deployments);
            const scheduleCount = scheduleList(schedules).length;
            const resolvedDatabaseId = database?.uuid || database?.id;
            const resolvedDatabaseName = database?.name;

            if (resolvedDatabaseId !== databaseId) {
              throw new Error(`Unexpected D1 id: ${resolvedDatabaseId || "missing"}`);
            }
            if (resolvedDatabaseName !== process.env.DATABASE_NAME) {
              throw new Error(`Unexpected D1 name: ${resolvedDatabaseName || "missing"}`);
            }
            if (active.versionId !== process.env.EXPECTED_VERSION) {
              throw new Error(`Unexpected active Worker version: ${active.versionId || "missing"}`);
            }
            if (active.deploymentId !== process.env.EXPECTED_DEPLOYMENT) {
              throw new Error(`Unexpected active deployment: ${active.deploymentId || "missing"}`);
            }
            if (scheduleCount !== 0) {
              throw new Error(`Unexpected Cron count: ${scheduleCount}`);
            }

            const state = {
              accountAccess: true,
              d1Access: true,
              databaseId: resolvedDatabaseId,
              databaseName: resolvedDatabaseName,
              deploymentId: active.deploymentId,
              versionId: active.versionId,
              scheduleCount,
              deploymentIds: deploymentList(deployments).map((item) => item.id).sort(),
            };
            fs.writeFileSync("/tmp/prestate.json", JSON.stringify(state));
            console.log(JSON.stringify({
              accountAccess: "OUI",
              d1TargetAccess: "OUI",
              databaseName: state.databaseName,
              databaseId: state.databaseId,
              deploymentId: state.deploymentId,
              versionId: state.versionId,
              cronCount: state.scheduleCount,
            }, null, 2));
          })().catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          NODE

      - name: Execute the only authorized SELECT
        shell: bash
        run: |
          set -euo pipefail
          sql='SELECT COUNT(*) AS member_count FROM core_members;'
          npx --yes wrangler@4 d1 execute "$DATABASE_NAME"             --remote             --command "$sql"             --json > /tmp/d1-result.json

          node <<'NODE'
          const fs = require("node:fs");
          const payload = JSON.parse(fs.readFileSync("/tmp/d1-result.json", "utf8"));
          const nodes = [];
          (function walk(value) {
            if (Array.isArray(value)) {
              for (const item of value) walk(item);
            } else if (value && typeof value === "object") {
              nodes.push(value);
              for (const item of Object.values(value)) walk(item);
            }
          })(payload);

          const countNode = nodes.find((item) => Object.prototype.hasOwnProperty.call(item, "member_count"));
          const memberCount = Number(countNode?.member_count);
          const metas = nodes.filter((item) =>
            Object.prototype.hasOwnProperty.call(item, "rows_read") ||
            Object.prototype.hasOwnProperty.call(item, "rows_written")
          );
          const rowsRead = metas.reduce((sum, item) => sum + Number(item.rows_read || 0), 0);
          const rowsWritten = metas.reduce((sum, item) => sum + Number(item.rows_written || 0), 0);

          if (!Number.isInteger(memberCount) || memberCount < 0) {
            throw new Error("member_count was not returned as an integer");
          }
          if (rowsWritten !== 0) {
            throw new Error(`Unexpected D1 rows_written: ${rowsWritten}`);
          }

          const summary = { memberCount, rowsRead, rowsWritten };
          fs.writeFileSync("/tmp/query-summary.json", JSON.stringify(summary));
          console.log(JSON.stringify({
            query: "SELECT COUNT(*) AS member_count FROM core_members;",
            member_count: memberCount,
            rows_read: rowsRead,
            rows_written: rowsWritten,
          }, null, 2));
          NODE

      - name: Read-only post-state verification
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const worker = process.env.WORKER_NAME;
          const databaseId = process.env.DATABASE_ID;
          const headers = { Authorization: `Bearer ${token}` };
          const before = JSON.parse(fs.readFileSync("/tmp/prestate.json", "utf8"));
          const query = JSON.parse(fs.readFileSync("/tmp/query-summary.json", "utf8"));

          async function get(path) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              method: "GET",
              headers,
            });
            const body = await response.json();
            if (!response.ok || !body.success) {
              throw new Error(`GET ${path} failed with HTTP ${response.status}`);
            }
            return body.result;
          }

          function deploymentList(value) {
            return Array.isArray(value) ? value : (value?.deployments || value?.items || []);
          }

          function scheduleList(value) {
            return Array.isArray(value) ? value : (value?.schedules || value?.items || []);
          }

          function activeDeployment(value) {
            const deployments = deploymentList(value)
              .slice()
              .sort((a, b) => Date.parse(b.created_on || b.created_at || 0) - Date.parse(a.created_on || a.created_at || 0));
            for (const deployment of deployments) {
              const active = (deployment.versions || []).find((version) => Number(version.percentage) === 100);
              if (active) {
                return {
                  deploymentId: deployment.id,
                  versionId: active.version_id || active.id,
                };
              }
            }
            return { deploymentId: null, versionId: null };
          }

          (async () => {
            const workerBase = `/accounts/${account}/workers/scripts/${worker}`;
            const [deployments, schedules, database] = await Promise.all([
              get(`${workerBase}/deployments`),
              get(`${workerBase}/schedules`),
              get(`/accounts/${account}/d1/database/${databaseId}`),
            ]);

            const active = activeDeployment(deployments);
            const after = {
              databaseId: database?.uuid || database?.id,
              databaseName: database?.name,
              deploymentId: active.deploymentId,
              versionId: active.versionId,
              scheduleCount: scheduleList(schedules).length,
              deploymentIds: deploymentList(deployments).map((item) => item.id).sort(),
            };

            const unchanged =
              after.databaseId === before.databaseId &&
              after.databaseName === before.databaseName &&
              after.deploymentId === before.deploymentId &&
              after.versionId === before.versionId &&
              after.scheduleCount === before.scheduleCount &&
              JSON.stringify(after.deploymentIds) === JSON.stringify(before.deploymentIds);

            if (!unchanged) {
              throw new Error(`Cloudflare state changed unexpectedly: ${JSON.stringify({ before, after })}`);
            }
            if (query.rowsWritten !== 0) {
              throw new Error(`Unexpected D1 rows_written: ${query.rowsWritten}`);
            }

            console.log(JSON.stringify({
              authenticationSecret: "CFPREVIEW",
              cloudflareAccountAccess: "OUI",
              remoteD1Access: "OUI",
              queryExecuted: "OUI",
              member_count: query.memberCount,
              rows_read: query.rowsRead,
              rows_written: query.rowsWritten,
              cronModified: "NON",
              workerModified: "NON",
              workerVersionModified: "NON",
              productionModified: "NON",
              powerModified: "NON",
              otherSiteModified: "NON",
              deploymentId: after.deploymentId,
              versionId: after.versionId,
            }, null, 2));
          })().catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          NODE
