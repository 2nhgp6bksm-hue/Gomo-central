name: One-shot Cloudflare token whoami

on:
  push:
    branches:
      - audit/cloudflare-token-whoami-2026-09-19
    paths:
      - .github/workflows/cloudflare-token-whoami-once.yml

permissions:
  contents: read

jobs:
  whoami:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CFPREVIEW }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PREVIEW || secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Verify Wrangler authentication only
        run: npx --yes wrangler@latest whoami
