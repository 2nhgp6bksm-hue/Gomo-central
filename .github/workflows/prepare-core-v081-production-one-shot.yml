name: Prepare Core v0.8.1 production one-shot safely

on:
  push:
    branches: [ops/core-v081-production-prepare-one-shot-2026-09-22]

concurrency:
  group: core-v081-production-prepare-one-shot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CFPREVIEW }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PREVIEW || secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_KEY: ${{ secrets.GOMO_CORE_ADMIN_KEY }}
      WORKER: gomo-central
      DB_ID: ac1b5094-c1f9-4706-b29b-8507e6f85a92
      EXPECTED_VERSION: 159ea799-13bd-4d7f-954d-249bb717da6c
      EXPECTED_DEPLOYMENT: d7d15d4e-561b-47c1-bfa3-75475a7382f7
      EXPECTED_SYNC: sync6_1789370115343_1d930c76
    steps:
      - name: Checkout exact production candidate
        uses: actions/checkout@v4
        with:
          ref: 2adc9e70891567a95be8cd9c194b3d45fc094a44
          persist-credentials: false

      - name: Require secrets without displaying values
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "Cloudflare token unavailable"; exit 1; }
          test -n "${ADMIN_KEY:-}" || { echo "GOMO_CORE_ADMIN_KEY unavailable in GitHub"; exit 1; }
          echo "Required secrets are present (values not displayed)."

      - name: Resolve account
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            accounts="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts?per_page=50")"
            CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$accounts" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.success||j.result?.length!==1)process.exit(1);process.stdout.write(j.result[0].id)})')"
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Preflight production GET only
        shell: bash
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER"
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/deployments" -o "$RUNNER_TEMP/deployments.json"
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/schedules" -o "$RUNNER_TEMP/schedules.json"
          curl -fsS "https://gomo-central.gjp86wh7p2.workers.dev/api/core/status?prepare-one-shot=20260922" -o "$RUNNER_TEMP/status.json"
          node - <<'NODE'
          const d=require(process.env.RUNNER_TEMP+'/deployments.json');
          const s=require(process.env.RUNNER_TEMP+'/schedules.json');
          const st=require(process.env.RUNNER_TEMP+'/status.json');
          const ds=Array.isArray(d.result)?d.result:(d.result?.deployments||[]);
          const cur=ds[0],live=cur?.versions?.find(v=>Number(v.percentage)===100);
          const ss=Array.isArray(s.result)?s.result:(s.result?.schedules||[]);
          if(cur?.id!==process.env.EXPECTED_DEPLOYMENT) throw Error('Deployment changed; STOP');
          if(live?.version_id!==process.env.EXPECTED_VERSION) throw Error('Version changed; STOP');
          if(ss.length!==0) throw Error('Cron present; STOP');
          if(st.coreVersion!=='0.8.1-fail-stable-test') throw Error('Unexpected Core version');
          if(st.safety?.currentStateReads!==true) throw Error('Current-state reads disabled');
          if(st.lastSuccessfulSync?.syncId!==process.env.EXPECTED_SYNC) throw Error('Sync changed; STOP');
          if(st.lastSuccessfulSync?.members!==94) throw Error('Unexpected stored member count');
          console.log(JSON.stringify({deployment:cur.id,version:live.version_id,traffic:live.percentage,crons:[],coreVersion:st.coreVersion,syncId:st.lastSuccessfulSync.syncId,members:st.lastSuccessfulSync.members},null,2));
          NODE

      - name: Capture D1 Time Travel bookmark GET only
        shell: bash
        run: |
          set -euo pipefail
          url="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$DB_ID/time_travel/bookmark"
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$url" -o "$RUNNER_TEMP/bookmark.json"
          node - <<'NODE'
          const j=require(process.env.RUNNER_TEMP+'/bookmark.json');
          if(!j.success||!j.result?.bookmark) throw Error('D1 bookmark unavailable');
          console.log(JSON.stringify({database:'gomo-core-db',databaseId:process.env.DB_ID,bookmark:j.result.bookmark},null,2));
          NODE

      - name: Install admin secret on production Worker
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$ADMIN_KEY" | npx --yes wrangler@4.136.1 secret put GOMO_CORE_ADMIN_KEY --config wrangler.production.jsonc >/dev/null
          echo "GOMO_CORE_ADMIN_KEY installed; value not displayed."

      - name: Verify secret name and no sync GET only
        shell: bash
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER"
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/settings" -o "$RUNNER_TEMP/settings.json"
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/deployments" -o "$RUNNER_TEMP/deployments-after.json"
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/schedules" -o "$RUNNER_TEMP/schedules-after.json"
          curl -fsS "https://gomo-central.gjp86wh7p2.workers.dev/api/core/status?secret-installed=20260922" -o "$RUNNER_TEMP/status-after.json"
          node - <<'NODE'
          const settings=require(process.env.RUNNER_TEMP+'/settings.json');
          const d=require(process.env.RUNNER_TEMP+'/deployments-after.json');
          const s=require(process.env.RUNNER_TEMP+'/schedules-after.json');
          const st=require(process.env.RUNNER_TEMP+'/status-after.json');
          const bindings=settings.result?.bindings||[];
          const admin=bindings.find(b=>b.name==='GOMO_CORE_ADMIN_KEY');
          if(!admin) throw Error('Runtime admin secret binding missing');
          const ds=Array.isArray(d.result)?d.result:(d.result?.deployments||[]);
          const cur=ds[0],live=cur?.versions?.find(v=>Number(v.percentage)===100);
          const ss=Array.isArray(s.result)?s.result:(s.result?.schedules||[]);
          if(ss.length!==0) throw Error('Cron unexpectedly present');
          if(st.lastSuccessfulSync?.syncId!==process.env.EXPECTED_SYNC) throw Error('A synchronization occurred; STOP');
          if(st.lastSuccessfulSync?.members!==94) throw Error('Stored member count changed');
          console.log(JSON.stringify({
            adminSecret:{name:admin.name,type:admin.type},
            deployment:cur?.id||null,
            version:live?.version_id||null,
            traffic:live?.percentage??null,
            crons:[],
            syncId:st.lastSuccessfulSync.syncId,
            members:st.lastSuccessfulSync.members
          },null,2));
          NODE
