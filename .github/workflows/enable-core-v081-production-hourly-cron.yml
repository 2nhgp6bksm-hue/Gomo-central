name: Enable single hourly Core v0.8.1 production Cron

on:
  push:
    branches: [ops/core-v081-production-hourly-cron-2026-09-22]

concurrency:
  group: core-v081-production-hourly-cron
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  enable:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CFPREVIEW }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PREVIEW || secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER: gomo-central
      EXPECTED_VERSION: a6fdbacf-a8f7-4574-af53-2e20aa771897
      EXPECTED_DEPLOYMENT: bbadd5a7-db52-4300-ad19-d2ed1f2f0e1c
      EXPECTED_SYNC: sync6_1790060781569_104b56b2
      CRON: "15 * * * *"
    steps:
      - name: Resolve account
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            a="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts?per_page=50")"
            CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$a" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.success||j.result?.length!==1)process.exit(1);process.stdout.write(j.result[0].id)})')"
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Preflight GET only
        shell: bash
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER"
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/deployments" -o "$RUNNER_TEMP/d.json"
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/schedules" -o "$RUNNER_TEMP/s.json"
          curl -fsS "https://gomo-central.gjp86wh7p2.workers.dev/api/core/status?cron-preflight=20260922" -o "$RUNNER_TEMP/status.json"
          node - <<'NODE'
          const d=require(process.env.RUNNER_TEMP+'/d.json');
          const s=require(process.env.RUNNER_TEMP+'/s.json');
          const st=require(process.env.RUNNER_TEMP+'/status.json');
          const ds=Array.isArray(d.result)?d.result:(d.result?.deployments||[]);
          const cur=ds[0],live=cur?.versions?.find(v=>Number(v.percentage)===100);
          const ss=Array.isArray(s.result)?s.result:(s.result?.schedules||[]);
          if(cur?.id!==process.env.EXPECTED_DEPLOYMENT) throw Error('Deployment changed; STOP');
          if(live?.version_id!==process.env.EXPECTED_VERSION) throw Error('Version changed; STOP');
          if(ss.length!==0) throw Error('Cron already exists; STOP');
          if(st.coreVersion!=='0.8.1-fail-stable-test') throw Error('Unexpected Core version; STOP');
          if(st.lastSuccessfulSync?.syncId!==process.env.EXPECTED_SYNC) throw Error('Sync changed since audit; STOP');
          console.log(JSON.stringify({deployment:cur.id,version:live.version_id,traffic:live.percentage,crons:[],syncId:st.lastSuccessfulSync.syncId,members:st.lastSuccessfulSync.members},null,2));
          NODE

      - name: Create exactly one hourly Cron
        shell: bash
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER"
          printf '[{"cron":"%s"}]' "$CRON" > "$RUNNER_TEMP/body.json"
          code="$(curl -sS -o "$RUNNER_TEMP/put.json" -w '%{http_code}' -X PUT             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json"             --data-binary @"$RUNNER_TEMP/body.json"             "$base/schedules")"
          echo "Cloudflare schedules PUT HTTP=$code"
          test "$code" = "200"
          node - <<'NODE'
          const j=require(process.env.RUNNER_TEMP+'/put.json');
          if(!j.success) throw Error('Cloudflare rejected Cron update');
          console.log(JSON.stringify({cronUpdate:'accepted'},null,2));
          NODE

      - name: Verify exactly one Cron GET only
        shell: bash
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER"
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/schedules" -o "$RUNNER_TEMP/after.json"
          curl -fsS "https://gomo-central.gjp86wh7p2.workers.dev/api/core/status?cron-after=20260922" -o "$RUNNER_TEMP/status-after.json"
          node - <<'NODE'
          const j=require(process.env.RUNNER_TEMP+'/after.json');
          const st=require(process.env.RUNNER_TEMP+'/status-after.json');
          const a=Array.isArray(j.result)?j.result:(j.result?.schedules||[]);
          const crons=a.map(x=>x.cron||x).filter(Boolean);
          if(crons.length!==1||crons[0]!==process.env.CRON) throw Error('Expected exactly one hourly Cron');
          if(st.lastSuccessfulSync?.syncId!==process.env.EXPECTED_SYNC) throw Error('Unexpected immediate synchronization');
          console.log(JSON.stringify({crons,syncId:st.lastSuccessfulSync.syncId,members:st.lastSuccessfulSync.members},null,2));
          NODE
