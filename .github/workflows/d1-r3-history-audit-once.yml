name: One-shot read-only R3 history coverage summary

on:
  push:
    branches:
      - audit/d1-read-precontrol-2026-09-21
    paths:
      - .github/workflows/d1-r3-history-audit-once.yml

permissions:
  contents: read

concurrency:
  group: gomo-core-d1-r3-history-audit-once
  cancel-in-progress: false

jobs:
  d1-r3-history-summary:
    if: github.event.before == '2d70984844f5abd0711c70768e86a8c46e07fe40'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CFPREVIEW }}
      CLOUDFLARE_ACCOUNT_ID: 8c513559f775c0cca653268ab2f29c0d
      DATABASE_NAME: gomo-core-v08-read-test-db

    steps:
      - name: Validate authentication without revealing values
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

