            r.day AS c1,
            CAST(COUNT(DISTINCT r.gomo_id) AS TEXT) AS c2,
            NULL AS c3, NULL AS c4, NULL AS c5,
            NULL AS c6, NULL AS c7, NULL AS c8
          FROM core_daily_member_rollups AS r
          JOIN current_r3 AS c ON c.gomo_id = r.gomo_id
          GROUP BY r.day

          UNION ALL

          SELECT
            'daily_summary' AS kind,
            MIN(r.day) AS c1,
            MAX(r.day) AS c2,
            CAST(COUNT(DISTINCT r.day) AS TEXT) AS c3,
            CAST(COUNT(*) AS TEXT) AS c4,
            CAST(COUNT(DISTINCT r.gomo_id) AS TEXT) AS c5,
            CAST(COUNT(DISTINCT CASE WHEN r.power IS NOT NULL THEN r.gomo_id END) AS TEXT) AS c6,
            CAST(COUNT(DISTINCT CASE WHEN r.hq IS NOT NULL THEN r.gomo_id END) AS TEXT) AS c7,
            CAST(COUNT(DISTINCT CASE WHEN r.hero_power IS NOT NULL THEN r.gomo_id END) AS TEXT) AS c8
          FROM core_daily_member_rollups AS r
          JOIN current_r3 AS c ON c.gomo_id = r.gomo_id

          UNION ALL

          SELECT
            'canonical_summary' AS kind,
            MIN(SUBSTR(s.observed_at, 1, 10)) AS c1,
            MAX(SUBSTR(s.observed_at, 1, 10)) AS c2,
            CAST(COUNT(DISTINCT SUBSTR(s.observed_at, 1, 10)) AS TEXT) AS c3,
            CAST(COUNT(*) AS TEXT) AS c4,
            CAST(COUNT(DISTINCT s.gomo_id) AS TEXT) AS c5,
            CAST(COUNT(DISTINCT CASE WHEN s.power IS NOT NULL THEN s.gomo_id END) AS TEXT) AS c6,
            CAST(COUNT(DISTINCT CASE WHEN s.hero_power IS NOT NULL THEN s.gomo_id END) AS TEXT) AS c7,
            CAST(COUNT(DISTINCT CASE WHEN s.kills IS NOT NULL THEN s.gomo_id END) AS TEXT) AS c8
          FROM core_canonical_snapshots AS s
          JOIN current_r3 AS c ON c.gomo_id = s.gomo_id

          ORDER BY kind, c1;"

          npx --yes wrangler@4 d1 execute "$DATABASE_NAME" \
            --remote \
            --command "$sql" \
            --json > /tmp/history-summary.json

          node <<'NODE'
          const fs = require("node:fs");
          const payload = JSON.parse(fs.readFileSync("/tmp/history-summary.json", "utf8"));
          const nodes = [];
          (function walk(value) {
            if (Array.isArray(value)) for (const item of value) walk(item);
            else if (value && typeof value === "object") {
              nodes.push(value);
              for (const item of Object.values(value)) walk(item);
            }
          })(payload);
          const rows = nodes.filter((item) =>
            ["daily_day", "daily_summary", "canonical_summary"].includes(item.kind)
          );
          const metas = nodes.filter((item) =>
            Object.prototype.hasOwnProperty.call(item, "rows_read") ||
            Object.prototype.hasOwnProperty.call(item, "rows_written")
          );
          const rowsRead = metas.reduce((sum, item) => sum + Number(item.rows_read || 0), 0);
          const rowsWritten = metas.reduce((sum, item) => sum + Number(item.rows_written || 0), 0);
          if (rowsWritten !== 0) throw new Error(`Unexpected D1 rows_written: ${rowsWritten}`);
          console.log(JSON.stringify({ rows, rows_read: rowsRead, rows_written: rowsWritten }, null, 2));
          NODE
