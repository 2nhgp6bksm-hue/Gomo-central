name: One-shot Core test preview endpoints diagnostic

on:
  push:
    branches:
      - test/core-d1-read-optimization
    paths:
      - .github/workflows/core-test-preview-endpoints-diagnostic-once.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CFPREVIEW }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PREVIEW || secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER: gomo-core-test
      PREVIEW_URL: https://cache-fail-open-gomo-core-test.gjp86wh7p2.workers.dev
    steps:
      - name: Confirm active version and Cron read-only
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            accounts="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts?per_page=50")"
            CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$accounts" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.success||j.result?.length!==1)process.exit(1);process.stdout.write(j.result[0].id)})')"
          fi
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER"
          deployments="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/deployments")"
          schedules="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/schedules")"
          DEPLOYMENTS="$deployments" SCHEDULES="$schedules" node - <<'NODE'
          const d=JSON.parse(process.env.DEPLOYMENTS), s=JSON.parse(process.env.SCHEDULES);
          if(!d.success||!s.success) process.exit(1);
          const deps=d.result?.deployments||d.result||[];
          const activeVersion=deps?.[0]?.versions?.[0]?.version_id||null;
          const list=Array.isArray(s.result)?s.result:(s.result?.schedules||[]);
          console.log('ACTIVE_VERSION='+activeVersion);
          console.log('ACTIVE_CRON='+JSON.stringify(list));
          if(activeVersion!=='fe297cda-d6fe-460b-b3da-ebbc5983e3ca') throw new Error('Active version changed');
          if(list.length!==1||list[0].cron!=='15 * * * *'||list[0].modified_on!=='2026-08-27T19:17:05.825335Z') throw new Error('Cron changed');
          NODE

      - name: Inspect preview GET endpoints separately
        shell: bash
        run: |
          set -euo pipefail
          for path in status members power; do
            code="$(curl --silent --show-error --retry 0 --max-time 30 -D "$path.headers" -o "$path.body" -w '%{http_code}' "$PREVIEW_URL/api/core/$path")"
            echo "PREVIEW_${path^^}_CODE=$code"
            echo "PREVIEW_${path^^}_HEADERS_BEGIN"
            cat "$path.headers"
            echo "PREVIEW_${path^^}_HEADERS_END"
            echo "PREVIEW_${path^^}_BODY_BEGIN"
            head -c 5000 "$path.body" || true
            echo
            echo "PREVIEW_${path^^}_BODY_END"
          done
